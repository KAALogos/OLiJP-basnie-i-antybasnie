<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>OLiJP Madzi — panel nauczyciela</title><style>
:root{--bg:#f5f4ef;--paper:#fffefa;--ink:#202d35;--muted:#617078;--line:#d8ddd9;--accent:#225c68;--soft:#eaf2f0;--warn:#8b4f28;--shadow:0 8px 26px #1d35420b}body.dark{--bg:#141e23;--paper:#1b2a31;--ink:#eaf0ee;--muted:#b2c0be;--line:#395058;--accent:#88cbd0;--soft:#233941;--warn:#f1bc8b;--shadow:none}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}.side{background:var(--paper);border-right:1px solid var(--line);padding:27px 18px;position:sticky;top:0;height:100vh;overflow:auto}.mark{font:600 24px/1.2 Georgia,serif;letter-spacing:-.7px}.side small{color:var(--muted)}.nav{display:grid;gap:4px;margin-top:28px}.nav button{border:0;text-align:left;background:none;padding:11px 12px;color:var(--ink);border-radius:9px;font-size:14px}.nav button.active,.nav button:hover{background:var(--soft);color:var(--accent)}.content{max-width:1160px;width:100%;padding:32px clamp(18px,4vw,52px);margin:auto}.top{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:22px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}h1{font:normal clamp(29px,3.5vw,46px)/1.18 Georgia,serif;letter-spacing:-.8px;margin:8px 0 12px}h2{font:normal 26px/1.3 Georgia,serif;margin:14px 0}h3{font-size:18px;margin:6px 0 10px}p{margin:9px 0 14px}.lead{font-size:18px;max-width:780px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.panel,.card{border:1px solid var(--line);border-radius:13px;background:var(--paper);padding:22px;box-shadow:var(--shadow);min-width:0}.card{cursor:default}.card h3{font-family:Georgia,serif}.muted,small{color:var(--muted)}.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border:1px solid var(--line);border-radius:15px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button,.btn{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);padding:9px 14px;background:var(--paper);color:var(--ink);text-decoration:none;display:inline-block}button:hover,.btn:hover{border-color:var(--accent)}button.primary,.btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:650}.dark button.primary{color:#14242b}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #bd9c58;outline-offset:3px}input,textarea,select{display:block;width:100%;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:10px 12px;border-radius:8px;font:inherit}textarea{min-height:110px;resize:vertical;line-height:1.6}textarea.mainwrite{min-height:260px}label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}label input,label textarea{font-weight:400;margin-top:5px}details{border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer;color:var(--accent);font-weight:650}a{color:var(--accent);overflow-wrap:anywhere}.stack{display:grid;gap:14px}.split{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.notice{border-left:3px solid var(--warn);padding:12px 16px;background:var(--soft);margin:12px 0}.ok{color:var(--accent)}.status{font-size:13px;color:var(--muted)}.bar{height:9px;background:var(--line);border-radius:12px;overflow:hidden}.bar span{height:100%;display:block;background:var(--accent)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar>*{flex:0 1 auto}.toolbar input{max-width:420px;flex:1 1 250px}.stats{display:flex;flex-wrap:wrap;gap:10px}.stat{flex:1;min-width:150px}.stat strong{font-size:27px;display:block;font-family:Georgia,serif}.hidden{display:none!important}.divider{height:1px;background:var(--line);margin:22px 0}.foot{font-size:12px;color:var(--muted);margin-top:35px}#toast{position:fixed;right:20px;bottom:15px;max-width:420px;padding:10px 16px;border:1px solid var(--line);border-radius:9px;background:var(--paper);box-shadow:var(--shadow);z-index:10}#mobile{display:none}.narrow{max-width:780px}ul{padding-left:24px}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:static;height:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap}.nav{display:flex;overflow:auto;width:100%;margin-top:12px;gap:3px}.nav button{white-space:nowrap}.content{padding:20px 15px}.split{grid-template-columns:1fr}.grid.three{grid-template-columns:1fr 1fr}}@media(max-width:580px){.grid,.grid.three{grid-template-columns:1fr}.panel,.card{padding:17px}.top{align-items:flex-start}h1{font-size:30px}}@media print{.side,.actions,.top button,.toolbar,#toast,.no-print,details:not([open]){display:none!important}.layout{display:block}.content{padding:0;max-width:none}.panel,.card{box-shadow:none;break-inside:avoid}.print-only{display:block!important}body{background:#fff;color:#000}textarea{border:0;white-space:pre-wrap}}
</style></head><body><div class="layout"><aside class="side"><div><div class="mark">OLiJP <span style="color:var(--accent)">/</span> Madzia</div><small>Materiał nauczycielski · osobny plik</small></div><nav class="nav" aria-label="Nawigacja główna"></nav></aside><main class="content"><div class="top"><span class="eyebrow">Zeszyt olimpijski · 15.10.2026</span><div class="actions no-print"><button id="theme" aria-label="Przełącz jasny lub ciemny motyw">◐ Motyw</button></div></div><div class="toolbar no-print" style="margin-bottom:20px"><button id="importStudent">Import prac Madzi</button><button id="exportGrades">Eksport ocen dla Madzi</button></div><div id="app"></div><p class="foot">MVP oparte na dokumentacji OLiJP z 15.10.2026. [T] pełny tekst • [T-oryginał] język źródłowy • [P] fragment • [B] bibliografia • [I] interpretacja • [H] hipoteza • [N] brak weryfikacji. Bez rankingu utworów.</p></main></div><div id="toast" hidden role="status" aria-live="polite"></div><input class="hidden" type="file" id="importFile" accept=".json,application/json"><script>
const D={"areas": [{"id": 1, "title": "Baśń jako gatunek i model narracyjny", "problem": "Trzeba osobno opisać fabułę (brak, wyruszenie, próba, pomoc, rozpoznanie, nagroda), zasady świata (status cudowności), głos narratora oraz sposób zamknięcia opowieści. Nie każdy utwór realizuje pełny schemat Proppa, nie każda magiczna ryba jest „darczyńcą” w jego ścisłym sensie.", "examples": "G-15 „O rybaku i jego żonie”: rozmowy z rybą, narastanie żądań i powrót do punktu wyjścia [T-oryginał niemiecki 1819; karta XI]. LK-02 „Jan Tajemnik”: czerwone buty jako dar wymykający się spod kontroli [P/T]. M-01 „Ofiara królewny”: droga królewicza i Wezyra, pomoc kraski, epilog „SWOBODA” [T/OCR].", "question": "Czy funkcję daru definiuje jego nadnaturalność, czy rola w dalszych działaniach? Co w „Ofierze…” pozostaje z modelu wyprawy po upragnione dobro?", "thesis": "Autor może zachować rekwizyty baśni, a zarazem przewartościować relacje między próbą i nagrodą.", "counter": "Fabuła od początku mogła być satyrą filozoficzną, a nie „uszkodzoną” baśnią — trzeba wykazać działanie konwencji.", "source": "G-15 KHM 19 red. 1819 [T-oryginał]; LK-02 [P/T]; M-01 archiwum X [T/OCR]; polskie kolacje [N].", "next": "Porównaj trzy funkcje narracyjne w G-15 i M-01", "exercises": [1, 4, 7]}, {"id": 2, "title": "Tradycje baśni i jej formy w literaturze różnych epok", "problem": "Inaczej funkcjonuje utrwalona redakcja ludowej bajki magicznej, autorska opowieść XIX-wieczna, modernistyczna groteska, XX-wieczna baśń japońska czy współczesna powieść przetwarzająca folklor. Rozróżnij epokę utworu, czas formowania tradycji, gatunek i współczesny sposób lektury.", "examples": "G-02 „Królewna Śnieżka” [T-oryginał 1819]; A-03 „Cień” [T-oryginał duński]; LK-03 „Majka” [P/T]; M-03 „Baśń o wężowym sercu…” [P: wyłącznie rozdziały I–III].", "question": "Który rodzaj wiedzy o świecie jest ważniejszy w każdej z tych form? Czym różni się wariant 1819 od współczesnego odczytania stereotypu?", "thesis": "Historia baśni jest historią sposobów wykorzystania odziedziczonej konwencji, a nie prostą drogą od „naiwności” do „krytycyzmu”.", "counter": "Szeroka perspektywa może zatrzeć różnicę między baśnią, podaniem, alegorią i powieścią.", "source": "G-02 Grimm 1819 [T-oryginał]; A-03 duński [T-oryginał]; LK-03 [P/T]; M-03 tylko I–III [P].", "next": "Zestaw dwa teksty z różnych epok i oddziel gatunek od konwencji", "exercises": [1, 5, 7]}, {"id": 3, "title": "Baśń jako światopogląd i forma poznania rzeczywistości", "problem": "Pytamy nie tylko o cud, lecz o to, SKĄD bohater i narrator „wiedzą”, co jest prawdą. Baśń może naturalizować reguły moralne, ujawniać kłamstwo, nadawać nazwy lękom lub pokazywać, jak społeczność produkuje fałszywą pewność.", "examples": "A-05 „Nowe szaty cesarza”: nie ma cudownej tkaniny, dwór podtrzymuje pozór, dziecko nazywa nagość, pochód trwa [T-oryginał]. A-03 „Cień”: zdobycie sekretów nie jest zrozumieniem prawdy [T-oryginał]. M-03: „Powiadają” [P]. O-03 „Smok”: nazwanie lęku [P].", "question": "Czy publicznie wypowiedziana prawda musi zwyciężyć społecznie? Czy nazwanie smoka wyjaśnia zagrożenie, czy je upraszcza?", "thesis": "Baśniowy sposób opowiadania pozwala analizować granicę między doświadczeniem, przekazem i autorytetem.", "counter": "Nie każda figura cudowna koduje epistemologię; może mieć funkcję komiczną lub przygodową.", "source": "A-05 i A-03 oryginały duńskie [T-oryginał]; M-03 i O-03 fragmenty [P]; finał O-03 [N].", "next": "Napisz 150 słów o społecznej prawdzie w A-05 z kontrargumentem", "exercises": [2, 4, 5]}, {"id": 4, "title": "Baśń jako lustro jednostkowej wrażliwości", "problem": "Tekst może ujawnić pragnienia, lęki i sposób patrzenia bohatera — lecz nie należy utożsamiać ich automatycznie z psychiką autora lub każdego dziecka. Ważne jest, KTO opowiada, kto widzi, a kogo głos zostaje pominięty.", "examples": "LK-03 „Majka”: Marcin otrzymuje zieloną księgę, nie potrafi jej przeczytać [P/T]. N-14 „Lisek Gon”: próba naprawienia winy anonimowymi darami, rozpoznanie za późno [T-oryginał japoński]. M-01: pragnienie królewny i interpretacja Wezyra [T/OCR].", "question": "Co wiesz o Majce od narratora, a co wyłącznie od Marcina? Czy skrucha Gon wystarczyłaby, gdyby jego zamiar został rozpoznany?", "thesis": "Baśń może pokazać dramat niedostępności cudzej perspektywy.", "counter": "Wymóg psychologicznej głębi w tekście stylizowanym może być anachroniczny.", "source": "LK-03 Wolne Lektury (PAX 1978) [P/T]; N-14 Aozora [T-oryginał]; M-01 OCR [T/OCR]; polski Niimi [N].", "next": "Porównaj dar dla Marcina i nieskuteczną naprawę winy lisa", "exercises": [3, 4]}, {"id": 5, "title": "Baśń jako manifestacja archetypów zbiorowej nieświadomości", "problem": "W perspektywie jungowskiej archetyp nie jest po prostu dowolnym powracającym przedmiotem. To pojęcie teoretyczne dotyczące wzorców organizujących wyobrażenia; obrazy cienia, lasu, wody i przemiany można sprawdzać jako możliwe manifestacje, ale samo ich wystąpienie nie dowodzi istnienia ani działania archetypu.", "examples": "A-03 usamodzielniony cień; M-03 rusałki i nocny krajobraz; G-15 morze i ryba — interpretacje archetypiczne WYŁĄCZNIE [H], bez odczytanej podstawy Junga/Campbella dla tych przykładów [B/N].", "question": "Jakiej dodatkowej przesłanki potrzeba, by od podobieństwa motywów przejść do interpretacji archetypicznej? Co lepiej wyjaśnia „Cień”: psychologiczny wzorzec czy społeczne mechanizmy kłamstwa?", "thesis": "Powtarzalne figury mogą nadawać jednostkowemu konfliktowi znaczenie ponadindywidualne. [H]", "counter": "Powtarzalność może wynikać z konwencji i przekazu kulturowego, nie ze zbiorowej nieświadomości.", "source": "A-03 duński; M-03 rozdz. I–III; G-15 Grimm 1819; Jung i Campbell bibliografia [B/N]; zastosowanie archetypiczne [H/N].", "next": "Napisz argument za i przeciw archetypiczności cienia", "exercises": [7]}, {"id": 6, "title": "Różne teorie baśni", "problem": "Modele odpowiadają na odrębne pytania: strukturalny „co robi postać?”, stylistyczny „jak opowiada narrator?”, psychoanalityczny „jakie konflikty może rozpoznać odbiorca?”, kulturowy „z jakim kanonem prowadzi dialog?”, folklorystyczny „jak utwór funkcjonuje w tradycji?”. Ich mechaniczne sklejenie daje pozorną wszechwiedzę.", "examples": "A-03 „Cień”: Propp — pozycja awansu oszusta? Lüthi — styl cudowności wobec obyczaju? Bettelheim — niepocieszający finał? Kostecka — przestawianie sankcji jako antycypacja strategii późniejszych, nie postmodernizm XIX wieku.", "question": "Który model najwięcej wyjaśnia w scenie ślubu cienia, a gdzie każdy traci moc? Czy model opisowy może być jednocześnie normatywnym kryterium „dobrej baśni”?", "thesis": "Spór o baśń często jest sporem o zakres pytań stawianych tekstowi, nie o pojedynczy „prawidłowy” klucz.", "counter": "Metody nie są dowolnie wymienne: respektuj ich korpus, czas i założenia.", "source": "Propp polski skrót 1968 [P]; Lüthi 1973 [T]; Bettelheim esej 1975 [P], polski tom 1985 [B]; Kostecka 2014 [T]; Abramowska 1986 [T]; Jung i inne [B/N].", "next": "Zastosuj dwie teorie do jednej sceny i wykaż granice obu", "exercises": [7]}, {"id": 7, "title": "Baśnie w strukturze dramatu i powieści", "problem": "Rozpoznaj, czy baśń jest szkieletem całej fabuły, osobną opowieścią bohatera, szeregiem motywów, zasadą poznania rzeczywistości czy narzędziem polemiki. Obecność rusałki nie wystarcza, by nazwać cały dramat baśnią.", "examples": "M-01 „Ofiara królewny” [T/OCR]: wyobrażenie królewny, pozorowane porwanie, podróż, odrzucona pomoc kraski, Ćwieczek i Gwoździk, epilog „SWOBODA”. M-03 Rak tylko I–III [P]; M-02 „Skrzypek Opętany” [B/H] bez pełnego dramatu.", "question": "Co by ubyło z M-01 po wyjęciu baśniowego schematu wędrówki? Kiedy muzyka w dramacie jest zdarzeniem, a kiedy komentarzem?", "thesis": "Baśń może organizować większy gatunek, a następnie zostać przez niego zakwestionowana.", "counter": "Satyryczna podróż nie musi być przekształconą baśnią; wymagany dowód współpracy wzoru próby, daru i zakończenia.", "source": "M-01 pełna transkrypcja archiwum X [T/OCR], wydanie druku [N]; M-03 tylko I–III [P]; M-02 dramat bez pełnego tekstu [B/H/N].", "next": "Sporządź schemat wędrówki M-01 z kontrinterpretacją", "exercises": [4, 5]}, {"id": 8, "title": "Antybaśń jako polemika z klasycznymi modelami baśni", "problem": "Nie chodzi o liczenie trupów. Trzeba wykazać oczekiwanie wywołane przez konwencję oraz dokładnie wskazać, którą regułę utwór rozbraja: sprawiedliwość, pomoc, nagrodę, autorytet opowieści, działanie cudu lub rozpoznanie.", "examples": "A-03 „Cień”: prestiż cienia, śmierć uczonego, ślub oszusta [T-oryginał]. G-15: przywrócenie sankcji baśniowej, niekoniecznie antybaśń. A-05: satyra jako konkurencyjny odczyt. N-14: tragizm sam nie dowodzi antybaśni.", "question": "Czy ślub cienia wynagradza cnotę, czy legitymizuje kłamstwo? Czy kara w G-15 polemizuje z klasyczną sprawiedliwością czy ją potwierdza?", "thesis": "Antybaśń najsilniej ujawnia się wtedy, kiedy pozytywny znak klasycznej baśni zostaje wykorzystany przeciw jej moralnemu sensowi.", "counter": "Taka definicja może objąć każdą satyrę z weselnym finałem; potrzebny dowód gry z baśnią.", "source": "A-03 i A-05 oryginał duński [T-oryginał]; G-15 Grimm 1819 [T-oryginał]; N-14 japoński [T-oryginał]; antybaśń [I].", "next": "Wskaż dwie naruszone reguły oraz kontrprzykład G-15", "exercises": [1, 2, 4]}, {"id": 9, "title": "Postmodernistyczny retelling znanych baśni", "problem": "Retelling jest nową wersją rozpoznawalnej opowieści, która prowadzi dialog z konkretnym pierwowzorem. „Postmodernistyczny” to mocniejsze twierdzenie: pytaj o świadomą grę z kanonem, rolami, władzą, perspektywą narracji, wartościowaniem oraz ewentualną autorefleksję tekstu. Sama modernizacja języka czy zamiana płci nie przesądza wszystkich tych cech.", "examples": "P-07 „Królewicz Śnieżek”: król szyje przy oknie, krew spada na śnieg [P fragment angielski]. Metoda Fransman: zamiana płci z zachowaniem wydarzeń i zakończeń [B]. Dokładny hipoteks, pełny tekst i polski przekład [N]. O-03 „Smok” [P] bez zweryfikowanego hipotekstu.", "question": "Czy zamiana szyjącej królowej na szyjącego króla zmienia rozkład sprawczości, czy uwidacznia stereotyp? Jakiego dowodu wymaga ocena „postmodernistyczności”?", "thesis": "Przy niezmienionej akcji przestawienie płci może skłonić czytelnika do krytycznej ponownej lektury kanonu. [I/H]", "counter": "Efekt odbioru nie dowodzi zmiany hierarchii wartości. Kostecka nie analizowała tu P-07.", "source": "P-07 angielski fragment [P], metoda twórców [B]; Kostecka 2014 [T teoria]; cały P-07 / polski przekład / dokładny hipoteks [N].", "next": "Rozpisz: co ustalono, co interpretujemy, co jest N", "exercises": [6]}], "exercises": [{"id": "E-01", "number": 1, "prompt": "G-15 oraz A-03: w 120–180 słowach wyjaśnij, dlaczego utrata dóbr i triumf oszusta to różne sposoby działania finału. Przywołaj po jednym zdarzeniu, tezę i kontrargument.", "minutes": 15, "works": ["G-15", "A-03"], "areas": [1, 2, 8]}, {"id": "E-02", "number": 2, "prompt": "A-05: obroń i zakwestionuj rozpoznanie „antybaśń”. Odróżnij nieistniejącą magiczną tkaninę od autentycznego cudu; napisz po dwa argumenty dla antybaśni i satyry.", "minutes": 20, "works": ["A-05"], "areas": [3, 8]}, {"id": "E-03", "number": 3, "prompt": "LK-03 lub LK-04: wybierz dar albo próbę. Napisz, czy przemienia sprawczość osoby, która go otrzymuje. Zaznacz, kiedy mówi narrator, a kiedy bohater.", "minutes": 20, "works": ["LK-03", "LK-04"], "areas": [4]}, {"id": "E-04", "number": 4, "prompt": "M-01: porównaj początek (wyobrażenie królewny o idealnym ukochanym), odrzucenie wdzięczności kraski i epilog. Wykaż albo odrzuć tezę o antybaśniowej architekturze całej powieści; nie traktuj Wezyra jako głosu autora.", "minutes": 25, "works": ["M-01"], "areas": [1, 3, 7, 8]}, {"id": "E-05", "number": 5, "prompt": "M-03 tylko I–III: zanotuj trzy formy „Powiadają” i określ: obserwacja / plotka / tradycja / stanowisko narratora. Wyraźnie zaznacz, czego na tej podstawie NIE wolno twierdzić o finale powieści.", "minutes": 15, "works": ["M-03"], "areas": [2, 3, 7]}, {"id": "E-06", "number": 6, "prompt": "P-07: napisz argument i kontrargument: „Zamiana płci przy zachowaniu fabuły może być postmodernistycznym retellingiem”. Oddziel ujawnioną metodę autorów od niepoznanej całości tekstu.", "minutes": 20, "works": ["P-07"], "areas": [9]}, {"id": "E-07", "number": 7, "prompt": "Na jeden i ten sam fragment „Cienia” zastosuj dwie metody: Proppa i Kosteckiej albo Lüthiego i Bettelheima. Zakończ zdaniem o granicach obu modeli.", "minutes": 30, "works": ["A-03"], "areas": [1, 5, 6]}, {"id": "E-08", "number": 8, "prompt": "Minirozprawka: „Czy baśń jest obietnicą sprawiedliwego porządku, czy narzędziem ujawniania jego iluzji?”. Użyj dwóch tekstów, odwołaj się do kontrargumentu i wskaż statusy źródeł. To ćwiczenie, nie wybór czterech utworów.", "minutes": 45, "works": [], "areas": [1, 3, 8]}], "works": [{"id": "G-15", "author": "Bracia Grimm", "title": "O rybaku i jego żonie", "epoch": "redakcja 1819", "scenes": "Narastanie żądań, rozmowy z rybą, utrata dóbr; finał", "status": "[T-oryginał] niemiecki 1819; polski przekład Madzi [N]", "areas": [1, 2, 5, 8], "link": "https://de.wikisource.org/wiki/Von_dem_Fischer_un_siine_Fru_(1819)", "unknown": ""}, {"id": "G-02", "author": "Bracia Grimm", "title": "Królewna Śnieżka", "epoch": "redakcja 1819", "scenes": "Historyczna redakcja Sneewittchen; kontrola wariantu", "status": "[T-oryginał] niemiecki 1819, kolacja 2021 [N]", "areas": [2], "link": "https://de.wikisource.org/wiki/Sneewittchen_(1819)", "unknown": ""}, {"id": "A-03", "author": "Hans Christian Andersen", "title": "Cień", "epoch": "XIX w.", "scenes": "Dom Poezji; role uczony/cień; finał małżeństwa", "status": "[T-oryginał] duński; polska edycja [N]", "areas": [1, 2, 3, 5, 6, 8], "link": "https://hcandersen.dk/vaerker/skyggen/", "unknown": ""}, {"id": "A-05", "author": "Hans Christian Andersen", "title": "Nowe szaty cesarza", "epoch" go; nie synonim smutnej baśni.", "Parafraza": "Przekształcenie cudzego tekstu z zachowaniem rozpoznawalnej podstawy, także bez zmiany sensu.", "Retelling": "Nowe opowiedzenie rozpoznawalnej wcześniejszej historii; sprawdź hipoteks, transformację i skutki interpretacyjne.", "Intertekstualność": "Relacje między tekstami: cytat, aluzja, przepisanie fabuły i polemika.", "Hipotekst": "Wcześniejszy tekst będący podstawą transformacji; nie domyślaj go z tytułu.", "Autotematyzm": "Tekstowe komentowanie własnego opowiadania, konstruowania fikcji lub reguł gatunku.", "Archetyp": "W teorii jungowskiej hipotetyczny powtarzalny wzorzec psychiczno-symboliczny, a nie pojedynczy motyw.", "Motyw": "Element powracający w fabułach.", "Symbol": "Znak o znaczeniach wykraczających poza dosłowność.", "Funkcja narracyjna": "W ujęciu Proppa działanie postaci zdefiniowane przez rolę w przebiegu akcji.", "Aksjologia": "Układ wartości: co tekst pochwala, potępia, problematyzuje i komu przypisuje nagrodę.", "Sprawczość": "Zdolność postaci do wpływania na bieg zdarzeń.", "Narrator niewiarygodny": "Narrator, którego rozpoznania czy opowieść dają powody do korekty; pogłoska bohatera nie jest głosem narratora.", "Groteska": "Łączenie porządków i deformacja prowadząca do ambiwalencji lub krytycznego komizmu.", "Satyra": "Krytyczne ośmieszenie zjawisk i postaw; nie musi być antybaśnią."}, "theories": [["Propp", "Co robi postać w strukturze akcji?", "G-15: narastanie żądań; A-03: czy awans cienia jest funkcją?", "Porządkuje czynności i relacje funkcji.", "Rosyjska bajka magiczna; polska publikacja 1968 jest skrótem [P]. Nie opisuje symboliki, psychoterapii ani wszystkich baśni."], ["Lüthi", "Jakim stylem tekst opowiada i co odróżnia baśń od podania?", "A-03: cudowność i świat obyczaju; zestawienie G-15 z tekstem modernistycznym.", "Rozdziela podobieństwo motywów od stylu gatunkowego.", "Klasyfikacja stylu nie dowodzi antybaśniowości; „Style gatunkowe” 1973 [T]."], ["Bettelheim", "Jakie konflikty i identyfikacje może rozpoznać odbiorca?", "A-03: czy finał bez pocieszenia podważa oczekiwania modelu?", "Pozwala pytać o psychologiczną funkcję opowieści.", "Nie dowodzi empirycznego wpływu na Madzię; esej 1975 [P], polski tom 1985 [B]."], ["Kostecka", "Jak tekst gra z kanonem, intertekstualnością i hierarchią wartości?", "P-07: metoda permutacji płci [P/B], hipoteza skutków [I/H]; A-03 jako analogia, nie historyczny postmodernizm.", "Porządkuje pytania o retelling i przekształcanie gatunku.", "Nie przypisywać autorce interpretacji P-07; opracowanie 2014 [T]."], ["Abramowska", "Gdzie przebiegają granice modelu bajki staropolskiej?", "Kontrolne odróżnienie bajki ezopowej od magicznej (np. G-15).", "Chroni przed mieszaniem pokrewnych form.", "Artykuł 1986 [T] zasadniczo o bajce ezopowej, nie Grimmach."], ["Jung / Campbell / Wróblewska", "Jakie podejścia sugeruje bibliografia?", "Temat 5 i motywy cienia/morza — tylko hipotezy [H].", "Pozwalają sformułować pytania do przyszłej lektury.", "Brak odczytanej właściwej podstawy [B/N]; żadnych przypisanych im szczegółowych interpretacji."]], "diagnostic": "„Baśń może jednocześnie obiecywać sprawiedliwy porządek i odsłaniać mechanizmy jego naruszania”. Rozważ trafność tej tezy, analizując DWA albo TRZY konkretne utwory z poznanego korpusu. Zbadaj funkcję co najmniej jednego finału oraz relację między konwencją baśniową a wartościowaniem. Odwołaj się krytycznie do JEDNEJ z poznanych teorii baśni. Uwzględnij poważny kontrargument i wyraźnie odróżnij głos narratora od głosu bohatera.", "rubric": [["Teza i odpowiedź na problem", 4], ["Dowody tekstowe", 5], ["Interpretacja", 4], ["Zastosowanie teorii", 3], ["Kontrargument", 2], ["Kompozycja i język", 2]], "bank": [["A", "Klasyczna baśń nie musi mieć łagodnej kary", "G-15: narastające żądania, utrata dóbr [T-oryginał]; [I] kara przywraca porządek, nie musi go negować."], ["B", "Wesele nie zawsze znaczy triumf dobra", "A-03: śmierć uczonego i ślub cienia [T-oryginał]; antybaśń [I]. Konkurencyjnie: władza, prestiż, wiedza."], ["C", "Deklarowana cudowność nie musi być rzeczywista", "A-05: oszustwo tkaczy, wyjawienie nagości, pochód trwa [T-oryginał]. Konkurencja: satyra."], ["D", "Dar nie gwarantuje poznania", "LK-03: zielona księga dla niepiśmiennego Marcina [P/T]; napięcie między rzeczą a sensem [I]."], ["E", "Cudowność może organizować powieść i rozsadzać nagrodę", "M-01: kraska, królestwa, SWOBODA [T/OCR]; alternatywa: powiastka filozoficzna."], ["F", "Opowieść o magii może być przekazem społecznym", "M-03 „Powiadają” [P I–III]; nie wnioskować o całej powieści."], ["G", "Zmiana płci może odsłaniać schemat wyobrażeń", "P-07 król szyje [P], metoda [B], efekt [I/H]; brak pełnego porównania."], ["H", "Tragedia bez komunikacji nie dowodzi antybaśni", "N-14 anonimowe zadośćuczynienie [T-oryginał], niewiedza o intencjach [I]."]], "warnings": ["Smutna baśń ≠ antybaśń; wymagaj wskazania złamanej reguły.", "Magiczna postać ≠ dowód baśniowej konstrukcji całej powieści.", "Cień Andersena nie jest automatycznie jungowski [N].", "W „Nowych szatach cesarza” nie ma działającej magicznej tkaniny.", "Propp: funkcja narracyjna, nie symbolika i psychoterapia.", "Abramowska bada bajkę staropolską, nie Grimmów.", "Nie przypisuj Kosteckiej analizy P-07.", "Nie stwierdzaj finału M-03 ani M-02 bez tekstów.", "Zbiór Niimiego czy Leśmiana to nie jeden utwór.", "Zmiana płci u Fransman nie oznacza zmiany fabuły — deklarowano zachowanie wydarzeń i finałów."], "research": ["Słownik Sławińskiego i Vademecum bez autopsji [N]", "Kolacje Grimm 2021, polski Andersen, Niimi 2020 [N]", "Jung / Campbell / Wróblewska [B/N]", "M-01: dokładne wydanie i kolacja OCR z Kraków 1985 [N]", "M-02: pełny dramat i didaskalia [N]", "M-03: poza rozdziałami I–III [N]", "P-07: całość, polski przekład, bezpośredni angielski hipoteks [N]", "O-03: pełny tekst i finał [N]"]};const $=(q,r=document)=>r.querySelector(q);const el=(s)=>{let x=document.createElement('div');x.innerHTML=s;return x.firstElementC const TK='olijp-teacher-v1';const fresh=()=>({kind:'olijp-teacher',version:1,student:null,feedback:[]});let state;try{let x=JSON.parse(safe(TK)||'null');state=x?.kind==='olijp-teacher'?x:fresh()}catch(e){state=fresh()}const persist=()=>save(TK,JSON.stringify(state));let tab='coverage',task='DIAG-01';const tabs=[['coverage','Mapa pokrycia'],['arguments','Bank argumentów'],['warnings','Ostrzeżenia'],['open','Otwarte problemy'],['student','Prace Madzi'],['grading','Ocena i informacja zwrotna'],['history','Historia ocen']];$('.nav').innerHTML=tabs.map(([id,n])=>`<button data-tab="${id}">${n}</button>`).join('');$('.nav').onclick=e=>{let t=e.target.closest('[data-tab]');if(t)nav(t.dataset.tab)};$('#theme').onclick=theme;$('#importStudent').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{let o=await readJSON(e.target.files[0]);if(!validStudent(o))throw Error('To nie jest prawidłowy eksport prac Madzi.');if(confirm('Wczytać przekazane prace Madzi? Zastąpią dotychczas zaimportowany zestaw, ale zachowają oceny nauczyciela.')){state.student=o;persist();nav('student');toast('Prace wczytano.')}}catch(err){alert(err.message)}finally{e.target.value=''}};$('#exportGrades').onclick=()=>{if(!state.feedback.length){alert('Brak ocen do eksportu.');return}download({kind:'olijp-feedback',version:1,feedback:state.feedback},'OLiJP_oceny_dla_Madzi.json')};
function nav(x){tab=x;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===x));render();window.scrollTo(0,0)}
function coverage(){return `<h1>Mapa pokrycia zagadnień</h1><p class="lead">To stan rozpoznania źródeł, a nie poziom Madzi. 36/90 pełnych kart oraz siedem osobnych dossier duńskich. Bez rankingu.</p><div class="stack">${D.areas.map(a=>`<div class="panel"><span class="eyebrow">Zagadnienie ${a.id}</span><h3>${esc(a.title)}</h3><p>${esc(a.source)}</p><p class="muted">Luka / zalecane działanie: ${esc(a.next)}</p></div>`).join('')}</div>`}
function argumentsPage(){return `<h1>Bank zweryfikowanych argumentów</h1><div class="stack">${D.bank.map(b=>`<div class="panel"><span class="pill">Argument ${b[0]}</span><h3>${esc(b[1])}</h3><p>${esc(b[2])}</p></div>`).join('')}</div>`}
function simplePage(title,arr){return `<h1>${title}</h1><div class="stack">${arr.map(v=>`<div class="panel">${esc(v)}</div>`).join('')}</div>`}
function submitted(){let a=state.student?.answers||{};return `<h1>Zaimportowane prace Madzi</h1><p>Źródłem są pliki JSON przekazane przez uczennicę. Sama obecność szkicu nie oznacza opanowania zagadnienia.</p>${!state.student?'<div class="notice">Nie zaimportowano jeszcze żadnych prac. Użyj „Import prac Madzi”.</div>':`<div class="stack">${Object.entries(a).filter(([k,v])=>v.body||v.thesis).map(([id,v])=>`<div class="panel"><h3>${id==='DIAG-01'?'Rozprawka diagnostyczna':esc(id)}</h3><span class="pill">${v.status==='ready'?'Gotowe do oceny':'Szkic'}</span><p class="status">${wordCount(v.body)} słów · ${esc(v.updated||'')}</p><details><summary>Przeczytaj odpowiedź</summary><p style="white-space:pre-wrap">${esc(v.body)}</p>${['thesis','evidence','interpretation','counter','source'].map(k=>v[k]?`<p><strong>${k}:</strong> ${esc(v[k])}</p>`:'').join('')}</details><button data-grade="${esc(id)}">Oceń</button></div>`).join('')||'<p>Brak rozpoczętych odpowiedzi.</p>'}</div>`}`}
function grade(){let opts=[...D.exercises.map(e=>e.id),'DIAG-01'],a=state.student?.answers?.[task];return `<h1>Ocena i informacja zwrotna</h1><p>Rubryka diagnostyczna jest <strong>wewnętrzna, nie oficjalna</strong>. Punkty wpisuje nauczyciel; system tylko je sumuje.</p><label>Zadanie<select id="taskSelect">${opts.map(x=>`<option ${x===task?'selected':''}>${x}</option>`).join('')}</select></label><div class="split"><div class="panel"><h3>Praca uczennicy</h3>${a?`<p class="status">${a.status==='ready'?'Gotowe do oceny':'Szkic'} · ${wordCount(a.body)} słów</p><p style="white-space:pre-wrap">${esc(a.body||'')}</p><details><summary>Pola argumentacyjne i poprzednie wersje</summary>${['thesis','evidence','interpretation','counter','source'].map(k=>`<p><strong>${k}:</strong> ${esc(a[k]||'')}</p>`).join('')}<p>Wcześniejsze wersje: ${(a.revisions||[]).length}</p></details>`:'<div class="notice">Nie otrzymano pracy dla tego zadania. Ocena bez lektury odpowiedzi byłaby nierzetelna.</div>'}</div><div class="panel"><h3>Rubryka 0–20</h3>${D.rubric.map(([name,max],i)=>`<label>${esc(name)} (0–${max})<input type="number" min="0" max="${max}" step="1" value="0" data-points="${i}"></label>`).join('')}<p><strong>Razem: <span id="total">0</span>/20</strong></p><label>Wykazana umiejętność<textarea id="strength"></textarea></label><label>Błąd / najważniejsza trudność<textarea id="weakness"></textarea></label><label>Fragment wypowiedzi potwierdzający trudność<textarea id="quote"></textarea></label><label>Następne jedno ćwiczenie<textarea id="next"></textarea></label><label>Uwagi dodatkowe<textarea id="other"></textarea></label><label>Powiązane zagadnienia (numery rozdziel przecinkami)<input id="gradeAreas" placeholder="np. 3,8"></label><div class="actions"><button class="primary" id="saveGrade">Zapisz ocenę</button></div><div class="notice" id="previewFeedback">Wpisz informację zwrotną. Powstanie na podstawie ocen i uwag nauczyciela, bez automatycznej diagnozy tekstu.</div></div></div>`}
function history(){return `<h1>Historia ocen i poprawek</h1>${state.feedback.length?`<div class="stack">${state.feedback.slice().reverse().map(f=>`<div class="panel"><h3>${esc(f.task)} · ${f.points.reduce((a,b)=>a+b,0)}/20</h3><p class="status">${esc(f.date)} · identyfikator ${esc(f.id)}</p><p>${esc(f.comment)}</p><p><strong>Kolejne zadanie:</strong> ${esc(f.next)}</p></div>`).join('')}</div>`:'<p>Brak ocen — jeszcze nie badano.</p>'}`}
function render(){let root=$('#app');root.innerHTML=tab==='coverage'?coverage():tab==='arguments'?argumentsPage():tab==='warnings'?simplePage('Ostrzeżenia interpretacyjne',D.warnings):tab==='open'?simplePage('Otwarte problemy źródłowe',D.research):tab==='student'?submitted():tab==='grading'?grade():history();root.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{task=b.dataset.grade;nav('grading')});if(tab==='grading')wireGrade()}
function wireGrade(){const pts=[...document.querySelectorAll('[data-points]')];const total=()=>$('#total').textContent=pts.reduce((s,x)=>s+(Number(x.value)||0),0);pts.forEach(p=>p.oninput=total);$('#taskSelect').onchange=e=>{task=e.target.value;render()};const preview=()=>{let a=$('#strength').value,w=$('#weakness').value,q=$('#quote').value,n=$('#next').value;$('#previewFeedback').textContent=`Najsilniejszy fragment Twojej pracy: ${a||'[nie wpisano]'}. Najważniejsza trudność: ${w||'[nie wpisano]'}${q?' (dowód: '+q+')':''}. Kolejny krok: ${n||'[nie wpisano]'}.`};['#strength','#weakness','#quote','#next','#other'].forEach(x=>$(x).addEventListener('input',preview));$('#saveGrade').onclick=()=>{if(!state.student?.answers?.[task]){alert('Brak zaimportowanej pracy do oceny.');return}let values=pts.map(x=>Number(x.value));if(values.some((v,i)=>!Number.isInteger(v)||v<0||v>D.rubric[i][1])){alert('Wpisz całkowite punkty w granicach rubryki.');return}if(!$('#strength').value.trim()||!$('#weakness').value.trim()||!$('#quote').value.trim()||!$('#next').value.trim()){alert('Wypełnij osiągnięcie, błąd, dowód w pracy i następne zadanie.');return}let ids=$('#gradeAreas').value.split(',').map(x=>Number(x.trim())).filter(x=>Number.isInteger(x)&&x>=1&&x<=9);let comment=$('#previewFeedback').textContent+' '+$('#other').value.trim();state.feedback.push({id:'F-'+Date.now()+'-'+state.feedback.length,task,date:stamp(),points:values,areas:[...new Set(ids)],strength:$('#strength').value,weakness:$('#weakness').value,quote:$('#quote').value,next:$('#next').value,comment});persist();toast('Ocena zapisana. Wyeksportuj ją dla Madzi.');nav('history')}}persist();nav('coverage');
</script></body></html>
