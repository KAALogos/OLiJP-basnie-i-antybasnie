:root{--bg:#f5f4ef;--paper:#fffefa;--ink:#202d35;--muted:#617078;--line:#d8ddd9;--accent:#225c68;--soft:#eaf2f0;--warn:#8b4f28;--shadow:0 8px 26px #1d35420b}body.dark{--bg:#141e23;--paper:#1b2a31;--ink:#eaf0ee;--muted:#b2c0be;--line:#395058;--accent:#88cbd0;--soft:#233941;--warn:#f1bc8b;--shadow:none}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}.side{background:var(--paper);border-right:1px solid var(--line);padding:27px 18px;position:sticky;top:0;height:100vh;overflow:auto}.mark{font:600 24px/1.2 Georgia,serif;letter-spacing:-.7px}.side small{color:var(--muted)}.nav{display:grid;gap:4px;margin-top:28px}.nav button{border:0;text-align:left;background:none;padding:11px 12px;color:var(--ink);border-radius:9px;font-size:14px}.nav button.active,.nav button:hover{background:var(--soft);color:var(--accent)}.content{max-width:1160px;width:100%;padding:32px clamp(18px,4vw,52px);margin:auto}.top{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:22px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}h1{font:normal clamp(29px,3.5vw,46px)/1.18 Georgia,serif;letter-spacing:-.8px;margin:8px 0 12px}h2{font:normal 26px/1.3 Georgia,serif;margin:14px 0}h3{font-size:18px;margin:6px 0 10px}p{margin:9px 0 14px}.lead{font-size:18px;max-width:780px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.panel,.card{border:1px solid var(--line);border-radius:13px;background:var(--paper);padding:22px;box-shadow:var(--shadow);min-width:0}.card{cursor:default}.card h3{font-family:Georgia,serif}.muted,small{color:var(--muted)}.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border:1px solid var(--line);border-radius:15px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button,.btn{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);padding:9px 14px;background:var(--paper);color:var(--ink);text-decoration:none;display:inline-block}button:hover,.btn:hover{border-color:var(--accent)}button.primary,.btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:650}.dark button.primary{color:#14242b}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #bd9c58;outline-offset:3px}input,textarea,select{display:block;width:100%;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:10px 12px;border-radius:8px;font:inherit}textarea{min-height:110px;resize:vertical;line-height:1.6}textarea.mainwrite{min-height:260px}label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}label input,label textarea{font-weight:400;margin-top:5px}details{border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer;color:var(--accent);font-weight:650}a{color:var(--accent);overflow-wrap:anywhere}.stack{display:grid;gap:14px}.split{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.notice{border-left:3px solid var(--warn);padding:12px 16px;background:var(--soft);margin:12px 0}.ok{color:var(--accent)}.status{font-size:13px;color:var(--muted)}.bar{height:9px;background:var(--line);border-radius:12px;overflow:hidden}.bar span{height:100%;display:block;background:var(--accent)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar>*{flex:0 1 auto}.toolbar input{max-width:420px;flex:1 1 250px}.stats{display:flex;flex-wrap:wrap;gap:10px}.stat{flex:1;min-width:150px}.stat strong{font-size:27px;display:block;font-family:Georgia,serif}.hidden{display:none!important}.divider{height:1px;background:var(--line);margin:22px 0}.foot{font-size:12px;color:var(--muted);margin-top:35px}#toast{position:fixed;right:20px;bottom:15px;max-width:420px;padding:10px 16px;border:1px solid var(--line);border-radius:9px;background:var(--paper);box-shadow:var(--shadow);z-index:10}#mobile{display:none}.narrow{max-width:780px}ul{padding-left:24px}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:static;height:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap}.nav{display:flex;overflow:auto;width:100%;margin-top:12px;gap:3px}.nav button{white-space:nowrap}.content{padding:20px 15px}.split{grid-template-columns:1fr}.grid.three{grid-template-columns:1fr 1fr}}@media(max-width:580px){.grid,.grid.three{grid-template-columns:1fr}.panel,.card{padding:17px}.top{align-items:flex-start}h1{font-size:30px}}@media print{.side,.actions,.top button,.toolbar,#toast,.no-print,details:not([open]){display:none!important}.layout{display:block}.content{padding:0;max-width:none}.panel,.card{box-shadow:none;break-inside:avoid}.print-only{display:block!important}body{background:#fff;color:#000}textarea{border:0;white-space:pre-wrap}}
</style></head><body><div class="layout"><aside class="side"><div><div class="mark">OLiJP <span style="color:var(--accent)">/</span> Madzia</div><small>Aplikacja uczennicy</small></div><nav class="nav" aria-label="Nawigacja główna"></nav></aside><main class="content"><div class="top"><span class="eyebrow">Zeszyt olimpijski · 15.10.2026</span><div class="actions no-print"><button id="theme" aria-label="Przełącz jasny lub ciemny motyw">◐ Motyw</button></div></div><div class="toolbar no-print" style="margin-bottom:20px"><button id="export">Eksportuj postępy JSON</button><button id="import">Importuj JSON / ocenę</button><span id="saveState" class="status" role="status"></span></div><div id="app"></div><p class="foot">MVP oparte na dokumentacji OLiJP z 15.10.2026. [T] pełny tekst • [T-oryginał] język źródłowy • [P] fragment • [B] bibliografia • [I] interpretacja • [H] hipoteza • [N] brak weryfikacji. Bez rankingu utworów.</p></main></div><div id="toast" hidden role="status" aria-live="polite"></div><input class="hidden" type="file" id="importFile" accept=".json,application/json"><script>
const D={"areas": [{"id": 1, "title": "Baśń jako gatunek i model narracyjny", "problem": "Trzeba osobno opisać fabułę (brak, wyruszenie, próba, pomoc, rozpoznanie, nagroda), zasady świata (status cudowności), głos narratora oraz sposób zamknięcia opowieści. Nie każdy utwór realizuje pełny schemat Proppa, nie każda magiczna ryba jest „darczyńcą” w jego ścisłym sensie.", "examples": "G-15 „O rybaku i jego żonie”: rozmowy z rybą, narastanie żądań i powrót do punktu wyjścia [T-oryginał niemiecki 1819; karta XI]. LK-02 „Jan Tajemnik”: czerwone buty jako dar wymykający się spod kontroli [P/T]. M-01 „Ofiara królewny”: droga królewicza i Wezyra, pomoc kraski, epilog „SWOBODA” [T/OCR].", "question": "Czy funkcję daru definiuje jego nadnaturalność, czy rola w dalszych działaniach? Co w „Ofierze…” pozostaje z modelu wyprawy po upragnione dobro?", "thesis": "Autor może zachować rekwizyty baśni, a zarazem przewartościować relacje między próbą i nagrodą.", "counter": "Fabuła od początku mogła być satyrą filozoficzną, a nie „uszkodzoną” baśnią — trzeba wykazać działanie konwencji.", "source": "G-15 KHM 19 red. 1819 [T-oryginał]; LK-02 [P/T]; M-01 archiwum X [T/OCR]; polskie kolacje [N].", "next": "Porównaj trzy funkcje narracyjne w G-15 i M-01", "exercises": [1, 4, 7]}, {"id": 2, "title": "Tradycje baśni i jej formy w literaturze różnych epok", "problem": "Inaczej funkcjonuje utrwalona redakcja ludowej bajki magicznej, autorska opowieść XIX-wieczna, modernistyczna groteska, XX-wieczna baśń japońska czy współczesna powieść przetwarzająca folklor. Rozróżnij epokę utworu, czas formowania tradycji, gatunek i współczesny sposób lektury.", "examples": "G-02 „Królewna Śnieżka” [T-oryginał 1819]; A-03 „Cień” [T-oryginał duński]; LK-03 „Majka” [P/T]; M-03 „Baśń o wężowym sercu…” [P: wyłącznie rozdziały I–III].", "question": "Który rodzaj wiedzy o świecie jest ważniejszy w każdej z tych form? Czym różni się wariant 1819 od współczesnego odczytania stereotypu?", "thesis": "Historia baśni jest historią sposobów wykorzystania odziedziczonej konwencji, a nie prostą drogą od „naiwności” do „krytycyzmu”.", "counter": "Szeroka perspektywa może zatrzeć różnicę między baśnią, podaniem, alegorią i powieścią.", "source": "G-02 Grimm 1819 [T-oryginał]; A-03 duński [T-oryginał]; LK-03 [P/T]; M-03 tylko I–III [P].", "next": "Zestaw dwa teksty z różnych epok i oddziel gatunek od konwencji", "exercises": [1, 5, 7]}, {"id": 3, "title": "Baśń jako światopogląd i forma poznania rzeczywistości", "problem": "Pytamy nie tylko o cud, lecz o to, SKĄD bohater i narrator „wiedzą”, co jest prawdą. Baśń może naturalizować reguły moralne, ujawniać kłamstwo, nadawać nazwy lękom lub pokazywać, jak społeczność produkuje fałszywą pewność.", "examples": "A-05 „Nowe szaty cesarza”: nie ma cudownej tkaniny, dwór podtrzymuje pozór, dziecko nazywa nagość, pochód trwa [T-oryginał]. A-03 „Cień”: zdobycie sekretów nie jest zrozumieniem prawdy [T-oryginał]. M-03: „Powiadają” [P]. O-03 „Smok”: nazwanie lęku [P].", "question": "Czy publicznie wypowiedziana prawda musi zwyciężyć społecznie? Czy nazwanie smoka wyjaśnia zagrożenie, czy je upraszcza?", "thesis": "Baśniowy sposób opowiadania pozwala analizować granicę między doświadczeniem, przekazem i autorytetem.", "counter": "Nie każda figura cudowna koduje epistemologię; może mieć funkcję komiczną lub przygodową.", "source": "A-05 i A-03 oryginały duńskie [T-oryginał]; M-03 i O-03 fragmenty [P]; finał O-03 [N].", "next": "Napisz 150 słów o społecznej prawdzie w A-05 z kontrargumentem", "exercises": [2, 4, 5]}, {"id": 4, "title": "Baśń jako lustro jednostkowej wrażliwości", "problem": "Tekst może ujawnić pragnienia, lęki i sposób patrzenia bohatera — lecz nie należy utożsamiać ich automatycznie z psychiką autora lub każdego dziecka. Ważne jest, KTO opowiada, kto widzi, a kogo głos zostaje pominięty.", "examples": "LK-03 „Majka”: Marcin otrzymuje zieloną księgę, nie potrafi jej przeczytać [P/T]. N-14 „Lisek Gon”: próba naprawienia winy anonimowymi darami, rozpoznanie za późno [T-oryginał japoński]. M-01: pragnienie królewny i interpretacja Wezyra [T/OCR].", "question": "Co wiesz o Majce od narratora, a co wyłącznie od Marcina? Czy skrucha Gon wystarczyłaby, gdyby jego zamiar został rozpoznany?", "thesis": "Baśń może pokazać dramat niedostępności cudzej perspektywy.", "counter": "Wymóg psychologicznej głębi w tekście stylizowanym może być anachroniczny.", "source": "LK-03 Wolne Lektury (PAX 1978) [P/T]; N-14 Aozora [T-oryginał]; M-01 OCR [T/OCR]; polski Niimi [N].", "next": "Porównaj dar dla Marcina i nieskuteczną naprawę winy lisa", "exercises": [3, 4]}, {"id": 5, "title": "Baśń jako manifestacja archetypów zbiorowej nieświadomości", "problem": "W perspektywie jungowskiej archetyp nie jest po prostu dowolnym powracającym przedmiotem. To pojęcie teoretyczne dotyczące wzorców organizujących wyobrażenia; obrazy cienia, lasu, wody i przemiany można sprawdzać jako możliwe manifestacje, ale samo ich wystąpienie nie dowodzi istnienia ani działania archetypu.", "examples": "A-03 usamodzielniony cień; M-03 rusałki i nocny krajobraz; G-15 morze i ryba — interpretacje archetypiczne WYŁĄCZNIE [H], bez odczytanej podstawy Junga/Campbella dla tych przykładów [B/N].", "question": "Jakiej dodatkowej przesłanki potrzeba, by od podobieństwa motywów przejść do interpretacji archetypicznej? Co lepiej wyjaśnia „Cień”: psychologiczny wzorzec czy społeczne mechanizmy kłamstwa?", "thesis": "Powtarzalne figury mogą nadawać jednostkowemu konfliktowi znaczenie ponadindywidualne. [H]", "counter": "Powtarzalność może wynikać z konwencji i przekazu kulturowego, nie ze zbiorowej nieświadomości.", "source": "A-03 duński; M-03 rozdz. I–III; G-15 Grimm 1819; Jung i Campbell bibliografia [B/N]; zastosowanie archetypiczne [H/N].", "next": "Napisz argument za i przeciw archetypiczności cienia", "exercises": [7]}, {"id": 6, "title": "Różne teorie baśni", "problem": "Modele odpowiadają na odrębne pytania: strukturalny „co robi postać?”, stylistyczny „jak opowiada narrator?”, psychoanalityczny „jakie konflikty może rozpoznać odbiorca?”, kulturowy „z jakim kanonem prowadzi dialog?”, folklorystyczny „jak utwór funkcjonuje w tradycji?”. Ich mechaniczne sklejenie daje pozorną wszechwiedzę.", "examples": "A-03 „Cień”: Propp — pozycja awansu oszusta? Lüthi — styl cudowności wobec obyczaju? Bettelheim — niepocieszający finał? Kostecka — przestawianie sankcji jako antycypacja strategii późniejszych, nie postmodernizm XIX wieku.", "question": "Który model najwięcej wyjaśnia w scenie ślubu cienia, a gdzie każdy traci moc? Czy model opisowy może być jednocześnie normatywnym kryterium „dobrej baśni”?", "thesis": "Spór o baśń często jest sporem o zakres pytań stawianych tekstowi, nie o pojedynczy „prawidłowy” klucz.", "counter": "Metody nie są dowolnie wymienne: respektuj ich korpus, czas i założenia.", "source": "Propp polski skrót 1968 [P]; Lüthi 1973 [T]; Bettelheim esej 1975 [P], polski tom 1985 [B]; Kostecka 2014 [T]; Abramowska 1986 [T]; Jung i inne [B/N].", "next": "Zastosuj dwie teorie do jednej sceny i wykaż granice obu", "exercises": [7]}, {"id": 7, "title": "Baśnie w strukturze dramatu i powieści", "problem": "Rozpoznaj, czy baśń jest szkieletem całej fabuły, osobną opowieścią bohatera, szeregiem motywów, zasadą poznania rzeczywistości czy narzędziem polemiki. Obecność rusałki nie wystarcza, by nazwać cały dramat baśnią.", "examples": "M-01 „Ofiara królewny” [T/OCR]: wyobrażenie królewny, pozorowane porwanie, podróż, odrzucona pomoc kraski, Ćwieczek i Gwoździk, epilog „SWOBODA”. M-03 Rak tylko I–III [P]; M-02 „Skrzypek Opętany” [B/H] bez pełnego dramatu.", "question": "Co by ubyło z M-01 po wyjęciu baśniowego schematu wędrówki? Kiedy muzyka w dramacie jest zdarzeniem, a kiedy komentarzem?", "thesis": "Baśń może organizować większy gatunek, a następnie zostać przez niego zakwestionowana.", "counter": "Satyryczna podróż nie musi być przekształconą baśnią; wymagany dowód współpracy wzoru próby, daru i zakończenia.", "source": "M-01 pełna transkrypcja archiwum X [T/OCR], wydanie druku [N]; M-03 tylko I–III [P]; M-02 dramat bez pełnego tekstu [B/H/N].", "next": "Sporządź schemat wędrówki M-01 z kontrinterpretacją", "exercises": [4, 5]}, {"id": 8, "title": "Antybaśń jako polemika z klasycznymi modelami baśni", "problem": "Nie chodzi o liczenie trupów. Trzeba wykazać oczekiwanie wywołane przez konwencję oraz dokładnie wskazać, którą regułę utwór rozbraja: sprawiedliwość, pomoc, nagrodę, autorytet opowieści, działanie cudu lub rozpoznanie.", "examples": "A-03 „Cień”: prestiż cienia, śmierć uczonego, ślub oszusta [T-oryginał]. G-15: przywrócenie sankcji baśniowej, niekoniecznie antybaśń. A-05: satyra jako konkurencyjny odczyt. N-14: tragizm sam nie dowodzi antybaśni.", "question": "Czy ślub cienia wynagradza cnotę, czy legitymizuje kłamstwo? Czy kara w G-15 polemizuje z klasyczną sprawiedliwością czy ją potwierdza?", "thesis": "Antybaśń najsilniej ujawnia się wtedy, kiedy pozytywny znak klasycznej baśni zostaje wykorzystany przeciw jej moralnemu sensowi.", "counter": "Taka definicja może objąć każdą satyrę z weselnym finałem; potrzebny dowód gry z baśnią.", "source": "A-03 i A-05 oryginał duński [T-oryginał]; G-15 Grimm 1819 [T-oryginał]; N-14 japoński [T-oryginał]; antybaśń [I].", "next": "Wskaż dwie naruszone reguły oraz kontrprzykład G-15", "exercises": [1, 2, 4]}, {"id": 9, "title": "Postmodernistyczny retelling znanych baśni", "problem": "Retelling jest nową wersją rozpoznawalnej opowieści, która prowadzi dialog z konkretnym pierwowzorem. „Postmodernistyczny” to mocniejsze twierdzenie: pytaj o świadomą grę z kanonem, rolami, władzą, perspektywą narracji, wartościowaniem oraz ewentualną autorefleksję tekstu. Sama modernizacja języka czy zamiana płci nie przesądza wszystkich tych cech.", "examples": "P-07 „Królewicz Śnieżek”: król szyje przy oknie, krew spada na śnieg [P fragment angielski]. Metoda Fransman: zamiana płci z zachowaniem wydarzeń i zakończeń [B]. Dokładny hipoteks, pełny tekst i polski przekład [N]. O-03 „Smok” [P] bez zweryfikowanego hipotekstu.", "question": "Czy zamiana szyjącej królowej na szyjącego króla zmienia rozkład sprawczości, czy uwidacznia stereotyp? Jakiego dowodu wymaga ocena „postmodernistyczności”?", "thesis": "Przy niezmienionej akcji przestawienie płci może skłonić czytelnika do krytycznej ponownej lektury kanonu. [I/H]", "counter": "Efekt odbioru nie dowodzi zmiany hierarchii wartości. Kostecka nie analizowała tu P-07.", "source": "P-07 angielski fragment [P], metoda twórców [B]; Kostecka 2014 [T teoria]; cały P-07 / polski przekład / dokładny hipoteks [N].", "next": "Rozpisz: co ustalono, co interpretujemy, co jest N", "exercises": [6]}], "exercises": [{"id": "E-01", "number": 1, "prompt": "G-15 oraz A-03: w 120–180 słowach wyjaśnij, dlaczego utrata dóbr i triumf oszusta to różne sposoby działania finału. Przywołaj po jednym zdarzeniu, tezę i kontrargument.", "minutes": 15, "works": ["G-15", "A-03"], "areas": [1, 2, 8]}, {"id": "E-02", "number": 2, "prompt": "A-05: obroń i zakwestionuj rozpoznanie „antybaśń”. Odróżnij nieistniejącą magiczną tkaninę od autentycznego cudu; napisz po dwa argumenty dla antybaśni i satyry.", "minutes": 20, "works": ["A-05"], "areas": [3, 8]}, {"id": "E-03", "number": 3, "prompt": "LK-03 lub LK-04: wybierz dar albo próbę. Napisz, czy przemienia sprawczość osoby, która go otrzymuje. Zaznacz, kiedy mówi narrator, a kiedy bohater.", "minutes": 20, "works": ["LK-03", "LK-04"], "areas": [4]}, {"id": "E-04", "number": 4, "prompt": "M-01: porównaj początek (wyobrażenie królewny o idealnym ukochanym), odrzucenie wdzięczności kraski i epilog. Wykaż albo odrzuć tezę o antybaśniowej architekturze całej powieści; nie traktuj Wezyra jako głosu autora.", "minutes": 25, "works": ["M-01"], "areas": [1, 3, 7, 8]}, {"id": "E-05", "number": 5, "prompt": "M-03 tylko I–III: zanotuj trzy formy „Powiadają” i określ: obserwacja / plotka / tradycja / stanowisko narratora. Wyraźnie zaznacz, czego na tej podstawie NIE wolno twierdzić o finale powieści.", "minutes": 15, "works": ["M-03"], "areas": [2, 3, 7]}, {"id": "E-06", "number": 6, "prompt": "P-07: napisz argument i kontrargument: „Zamiana płci przy zachowaniu fabuły może być postmodernistycznym retellingiem”. Oddziel ujawnioną metodę autorów od niepoznanej całości tekstu.", "minutes": 20, "works": ["P-07"], "areas": [9]}, {"id": "E-07", "number": 7, "prompt": "Na jeden i ten sam fragment „Cienia” zastosuj dwie metody: Proppa i Kosteckiej albo Lüthiego i Bettelheima. Zakończ zdaniem o granicach obu modeli.", "minutes": 30, "works": ["A-03"], "areas": [1, 5, 6]}, {"id": "E-08", "number": 8, "prompt": "Minirozprawka: „Czy baśń jest obietnicą sprawiedliwego porządku, czy narzędziem ujawniania jego iluzji?”. Użyj dwóch tekstów, odwołaj się do kontrargumentu i wskaż statusy źródeł. To ćwiczenie, nie wybór czterech utworów.", "minutes": 45, "works": [], "areas": [1, 3, 8]}], "works": [{"id": "G-15", "author": "Bracia Grimm", "title": "O rybaku i jego żonie", "epoch": "redakcja 1819", "scenes": "Narastanie żądań, rozmowy z rybą, utrata dóbr; finał", "status": "[T-oryginał] niemiecki 1819; polski przekład Madzi [N]", "areas": [1, 2, 5, 8], "link": "https://de.wikisource.org/wiki/Von_dem_Fischer_un_siine_Fru_(1819)", "unknown": ""}, {"id": "G-02", "author": "Bracia Grimm", "title": "Królewna Śnieżka", "epoch": "redakcja 1819", "scenes": "Historyczna redakcja Sneewittchen; kontrola wariantu", "status": "[T-oryginał] niemiecki 1819, kolacja 2021 [N]", "areas": [2], "link": "https://de.wikisource.org/wiki/Sneewittchen_(1819)", "unknown": ""}, {"id": "A-03", "author": "Hans Christian Andersen", "title": "Cień", "epoch": "XIX w.", "scenes": "Dom Poezji; role uczony/cień; finał małżeństwa", "status": "[T-oryginał] duński; polska edycja [N]", "areas": [1, 2, 3, 5, 6, 8], "link": "https://hcandersen.dk/vaerker/skyggen/", "unknown": ""}, {"id": "A-05", "author": "Hans Christian Andersen", "title": "Nowe szaty cesarza", "epoch" go; nie synonim smutnej baśni.", "Parafraza": "Przekształcenie cudzego tekstu z zachowaniem rozpoznawalnej podstawy, także bez zmiany sensu.", "Retelling": "Nowe opowiedzenie rozpoznawalnej wcześniejszej historii; sprawdź hipoteks, transformację i skutki interpretacyjne.", "Intertekstualność": "Relacje między tekstami: cytat, aluzja, przepisanie fabuły i polemika.", "Hipotekst": "Wcześniejszy tekst będący podstawą transformacji; nie domyślaj go z tytułu.", "Autotematyzm": "Tekstowe komentowanie własnego opowiadania, konstruowania fikcji lub reguł gatunku.", "Archetyp": "W teorii jungowskiej hipotetyczny powtarzalny wzorzec psychiczno-symboliczny, a nie pojedynczy motyw.", "Motyw": "Element powracający w fabułach.", "Symbol": "Znak o znaczeniach wykraczających poza dosłowność.", "Funkcja narracyjna": "W ujęciu Proppa działanie postaci zdefiniowane przez rolę w przebiegu akcji.", "Aksjologia": "Układ wartości: co tekst pochwala, potępia, problematyzuje i komu przypisuje nagrodę.", "Sprawczość": "Zdolność postaci do wpływania na bieg zdarzeń.", "Narrator niewiarygodny": "Narrator, którego rozpoznania czy opowieść dają powody do korekty; pogłoska bohatera nie jest głosem narratora.", "Groteska": "Łączenie porządków i deformacja prowadząca do ambiwalencji lub krytycznego komizmu.", "Satyra": "Krytyczne ośmieszenie zjawisk i postaw; nie musi być antybaśnią."}, "theories": [["Propp", "Co robi postać w strukturze akcji?", "G-15: narastanie żądań; A-03: czy awans cienia jest funkcją?", "Porządkuje czynności i relacje funkcji.", "Rosyjska bajka magiczna; polska publikacja 1968 jest skrótem [P]. Nie opisuje symboliki, psychoterapii ani wszystkich baśni."], ["Lüthi", "Jakim stylem tekst opowiada i co odróżnia baśń od podania?", "A-03: cudowność i świat obyczaju; zestawienie G-15 z tekstem modernistycznym.", "Rozdziela podobieństwo motywów od stylu gatunkowego.", "Klasyfikacja stylu nie dowodzi antybaśniowości; „Style gatunkowe” 1973 [T]."], ["Bettelheim", "Jakie konflikty i ide const fresh=()=>({kind:'olijp-student',version:1,answers:{},feedback:[],lastArea:1,created:stamp(),updated:stamp()});let state;try{const s=JSON.parse(safe(KEY)||'null');state=validStudent(s)?{...fresh(),...s}:fresh()}catch(e){state=fresh()}let dirty=false,view='start',selectedTask='E-01',area=1;const persist=()=>{state.updated=stamp();let ok=save(KEY,JSON.stringify(state));dirty=false;$('#saveState').textContent=ok?'Zapis lokalny aktualny':'Przeglądarka nie zapisuje — używaj eksportu JSON';return ok};const answer=id=>state.answers[id]||{body:'',thesis:'',evidence:'',interpretation:'',counter:'',source:'',status:'draft',revisions:[]};const nav=(v)=>{if(dirty&&!confirm('Masz niezapisane zmiany. Przejść dalej?'))return;view=v;$$nav();render();window.scrollTo(0,0)};const $$nav=()=>document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===view));const sections=[['start','Start'],['areas','Dziewięć zagadnień'],['library','Biblioteka utworów'],['glossary','Słownik i teorie'],['workshop','Warsztat interpretacyjny'],['diagnostic','Rozprawka diagnostyczna'],['progress','Moje postępy']];$('.nav').innerHTML=sections.map(([v,n])=>`<button data-nav="${v}">${n}</button>`).join('');$('.nav').onclick=e=>{const b=e.target.closest('[data-nav]');if(b)nav(b.dataset.nav)};$('#theme').onclick=theme;$('#export').onclick=()=>download(state,'OLiJP_Madzia_odpowiedzi.json');$('#import').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{const o=await readJSON(e.target.files[0]);if(validFeedback(o)){let newItems=o.feedback.filter(f=>!state.feedback.some(x=>x.id===f.id));if(!newItems.length){toast('Oceny już zaimportowano.');return}if(confirm('Dodać '+newItems.length+' ocen(y) nauczyciela? Dotychczasowe oceny pozostaną.')){state.feedback.push(...newItems);persist();render();toast('Informacja zwrotna zaimportowana.')}}else if(validStudent(o)){const n=Object.keys(o.answers).length;if(confirm(`Import pełnej kopii (${n} zadań). To ZASTĄPI lokalny stan. Najpierw wyeksportuj obecną kopię! Kontynuować?`)){state=o;persist();render();toast('Kopia wczytana.')}}else throw Error('Niepoprawny format JSON lub typ danych.')}catch(err){alert('Nie udało się wczytać: '+err.message)}finally{e.target.value=''}};function start(){let all=Object.values(state.answers),r=all.filter(x=>x.status==='ready').length,done=all.filter(x=>[x.body,x.thesis,x.evidence].some(y=>y?.trim())).length;let last=state.lastArea||1;return `<div class="eyebrow">OLiJP • samodzielny warsztat</div><h1>Baśnie i antybaśnie w literaturze różnych epok</h1><p class="lead">Czytaj tekst, nazwij fakt, postaw własną tezę i sprawdź ją kontrargumentem. To narzędzie do pracy — nie ranking lektur.</p><div class="grid three"><div class="panel stat"><span class="muted">Rozpoczęte prace</span><strong>${done}</strong><small>z 9 zadań, wraz z diagnozą</small></div><div class="panel stat"><span class="muted">Gotowe do oceny</span><strong>${r}</strong></div><div class="panel stat"><span class="muted">Zagadnienia ocenione</span><strong>${new Set(state.feedback.flatMap(f=>f.areas||[])).size}</strong><small>Pozostałe: jeszcze nie badano</small></div></div><div class="grid" style="margin-top:17px"><div class="panel"><h2>Kontynuuj naukę</h2><p>Ostatnie zagadnienie: ${last}. ${esc(D.areas[last-1].title)}</p><p><strong>Następne zadanie:</strong> ${esc(D.areas[last-1].next)}</p><button class="primary" id="continue">Kontynuuj naukę →</button></div><div class="panel"><h2>Jak pracować?</h2><p>Najpierw <strong>fakt tekstowy</strong>, później <strong>interpretacja</strong>, następnie <strong>najsilniejszy zarzut</strong>. Tezy z materiałów są schowane, aż zdecydujesz się je odsłonić.</p><p class="status">36/90 kart źródłowych + 7 dossier duńskich to postęp badań, a nie Twoja ocena.</p></div></div><h2>Dziewięć obszarów</h2><div class="grid three">${D.areas.map(a=>`<div class="card"><span class="eyebrow">Zagadnienie ${a.id}</span><h3>${esc(a.title)}</h3><button data-area="${a.id}">Otwórz →</button></div>`).join('')}</div>`}
function areasPage(){return `<div class="eyebrow">9 zagadnień Komitetu</div><h1>Problemy badawcze</h1><div class="toolbar"><label for="areaSelect">Wybierz zagadnienie</label><select id="areaSelect">${D.areas.map(a=>`<option value="${a.id}" ${area===a.id?'selected':''}>${a.id}. ${esc(a.title)}</option>`).join('')}</select></div>${areaCard(D.areas[area-1])}`}
function areaCard(a){return `<article class="panel"><h2>${a.id}. ${esc(a.title)}</h2><h3>Problem</h3><p>${esc(a.problem)}</p><h3>Przykłady z udokumentowanym zakresem</h3><p>${esc(a.examples)}</p><h3>Pytania interpretacyjne</h3><p>${esc(a.question)}</p><details><summary>Pokaż wskazówki interpretacyjne (teza i kontrargument)</summary><p><strong>Możliwa teza [I/H]:</strong> ${esc(a.thesis)}</p><p><strong>Poważny kontrargument:</strong> ${esc(a.counter)}</p></details><div class="notice"><strong>Podstawa i ograniczenia:</strong> ${esc(a.source)}</div><h3>Ćwiczenia</h3><div class="actions">${a.exercises.map(n=>`<button data-task="E-${String(n).padStart(2,'0')}">Ćwiczenie ${n}</button>`).join('')}</div><p><strong>Następne konkretne działanie:</strong> ${esc(a.next)}</p></article>`}
function library(){return `<h1>Biblioteka utworów</h1><p class="lead">Tylko utwory rzeczywiście omówione w MVP. Pozostałe ID katalogu 90 nie są tutaj pozorowane jako przebadane.</p><input id="searchLibrary" aria-label="Szukaj utworów" placeholder="Szukaj: autor, tytuł, ID, zagadnienie…"><div id="libraryCards" class="grid" style="margin-top:17px"></div><p class="status">Katalog 90 jest zamrożony, ale pełnego CSV nie wbudowano: bez weryfikacji treści katalogu nie wolno dopisać pozostałych tytułów.</p>`}
function renderLibrary(q=''){const t=q.toLocaleLowerCase('pl'),list=D.works.filter(w=>[w.id,w.author,w.title,w.epoch,w.scenes,w.areas.map(x=>D.areas[x-1]?.title).join(' '),w.areas.join(' ')].join(' ').toLocaleLowerCase('pl').includes(t));$('#libraryCards').innerHTML=list.map(w=>`<article class="panel"><span class="pill">${esc(w.id)}</span><h3>${esc(w.title)}</h3><p>${esc(w.author)} · ${esc(w.epoch)}</p><p><strong>Sceny i motywy:</strong> ${esc(w.scenes)}</p><details><summary>Podstawa, status i niewiadome</summary><p>${esc(w.status)}</p><p>${esc(w.unknown)}</p><p>${sourceLink(w.id)}</p><p><strong>Zagadnienia:</strong> ${w.areas.join(', ')||'Nie ustalono'}</p></details></article>`).join('')||'<p>Brak wyników.</p>'}
function glossary(){return `<h1>Słownik i teorie</h1><div class="toolbar"><input id="termSearch" placeholder="Szukaj pojęcia lub definicji…" aria-label="Szukaj w słowniku"></div><div id="terms" class="grid" style="margin-top:16px"></div><h2>Porównywarka modeli</h2><div class="grid">${D.theories.map(t=>`<div class="panel"><h3>${esc(t[0])}</h3><p><strong>Pytanie:</strong> ${esc(t[1])}</p><p><strong>Zastosowanie:</strong> ${esc(t[2])}</p><details><summary>Atuty i ograniczenia</summary><p><strong>Moc:</strong> ${esc(t[3])}</p><p><strong>Granice:</strong> ${esc(t[4])}</p></details></div>`).join('')}</div>`}
function terms(q=''){q=q.toLocaleLowerCase('pl');$('#terms').innerHTML=Object.entries(D.terms).filter(x=>x.join(' ').toLocaleLowerCase('pl').includes(q)).map(([k,v])=>`<div class="panel"><h3>${esc(k)}</h3><p>${esc(v)}</p></div>`).join('')||'<p>Brak wyników.</p>'}
function editor(id){let ex=D.exercises.find(e=>e.id===id),a=answer(id),diag=id==='DIAG-01',prompt=diag?D.diagnostic:ex.prompt,mins=diag?90:ex.minutes;return `<div class="eyebrow">${diag?'Rozprawka diagnostyczna':`Ćwiczenie ${ex.number} · ${mins} min`}</div><h1>${diag?'Rozprawka olimpijska':'Warsztat interpretacyjny'}</h1><div class="panel"><h3>Polecenie</h3><p>${esc(prompt)}</p><p class="status">${diag?'90 minut • sugerowane 450–650 słów • wyłącznie wewnętrzne parametry dydaktyczne, nie kryteria Komitetu.':`Czas: ${mins} minut; utwory: ${ex.works.join(', ')||'dwa samodzielnie wybrane'}`}</p>${!diag?`<details><summary>Podstawy tekstowe</summary>${ex.works.map(w=>`<p>${sourceLink(w)}</p>`).join('')}</details>`:''}</div><div class="panel" style="margin-top:15px"><details class="no-print"><summary>Podręczny słownik pojęć (bez opuszczania edytora)</summary><div class="grid">${Object.entries(D.terms).map(([k,v])=>`<div><strong>${esc(k)}</strong><p>${esc(v)}</p></div>`).join('')}</div></details><div class="toolbar"><span class="pill" id="editStatus">${a.status==='ready'?'Gotowe do oceny':'Wersja robocza'}</span><span id="counter">0 słów</span><span class="status" id="draftSave"></span></div><label for="body">${diag?'Treść całej rozprawki':'Moja odpowiedź'}</label><textarea class="mainwrite" data-field="body" id="body" placeholder="Zapisz własne rozumowanie, nie tylko streszczenie…">${esc(a.body||'')}</textarea>${!diag?`<div class="grid">${[['thesis','Teza'],['evidence','Dowód tekstowy i lokalizator'],['interpretation','Interpretacja dowodu'],['counter','Kontrargument'],['source','Tekst / edycja / strony']].map(([k,l])=>`<label>${l}<textarea data-field="${k}" rows="3">${esc(a[k]||'')}</textarea></label>`).join('')}</div>`:`<label>Źródła / dokładne edycje<textarea data-field="source">${esc(a.source||'')}</textarea></label>`}<div class="actions"><button class="primary" id="saveDraft">Zapisz szkic</button><button id="ready">Oznacz jako gotowe do oceny</button><button id="print">Drukuj / PDF</button><button id="exportOne">Eksport całego stanu JSON</button></div><div class="status" id="dirty"></div></div><div class="panel" style="margin-top:15px"><h3>Otrzymane informacje zwrotne</h3>${feedbackFor(id)}</div>`}
function feedbackFor(id){let f=state.feedback.filter(x=>x.task===id);return f.length?f.map(v=>`<div class="notice"><strong>${v.points.reduce((a,b)=>a+b,0)}/20</strong> · ${esc(v.date||'')}<p>${esc(v.comment)}</p><p><strong>Następne:</strong> ${esc(v.next||'')}</p></div>`).join(''):'<p class="muted">Jeszcze nie badano — brak ocen nauczyciela.</p>'}
function workshop(){return `<h1>Warsztat interpretacyjny</h1><p class="lead">Osiem ćwiczeń z materiału Madzi. Najpierw własna odpowiedź, potem ocena nauczyciela.</p><div class="grid">${D.exercises.map(e=>{let a=answer(e.id);return `<article class="card"><span class="pill">Ćwiczenie ${e.number} · ${e.minutes} minut</span><h3>${esc(e.prompt.slice(0,110))}${e.prompt.length>110?'…':''}</h3><p class="status">${a.status==='ready'?'Gotowe do oceny':a.body||a.thesis?'Rozpoczęte':'Jeszcze nie badano'}</p><button data-task="${e.id}">Otwórz edytor</button></article>`}).join('')}</div>`}
function progress(){let n=Object.values(state.answers).filter(x=>x.body?.trim()||x.thesis?.trim()).length;return `<h1>Moje postępy</h1><div class="notice">Stan badań: 36/90 pełnych kart i 7 dossier oryginałów duńskich. To NIE jest procent przygotowania Madzi. Selekcja 90 → 10–12 → 6–8 → 4 oraz metodologia 40/60 są odłożone, bez rankingu.</div><div class="grid"><div class="panel"><h3>Prace Madzi</h3><p>${n} rozpoczętych, ${Object.values(state.answers).filter(a=>a.status==='ready').length} gotowych do oceny, ${state.feedback.length} informacji zwrotnych.</p><p><strong>Umiejętności:</strong> tylko potwierdzone w ocenach nauczyciela, nie na podstawie samego otwarcia tekstu.</p></div><div class="panel"><h3>Kopia bezpieczeństwa</h3><p>Postęp zapisuje się w tej przeglądarce (o ile zezwala). Eksport JSON przenosi szkice i oceny na inny komputer.</p><button id="backUp">Eksportuj JSON</button></div></div><h2>Mapa dziewięciu zagadnień</h2><div class="stack">${D.areas.map(a=>{let fs=state.feedback.filter(f=>(f.areas||[]).includes(a.id));return `<div class="panel"><h3>${a.id}. ${esc(a.title)}</h3><span class="pill">${fs.length?'Oceniono '+fs.length+' prac(y)':'Jeszcze nie badano'}</span><p class="muted">${esc(a.source)}</p>${fs.map(f=>`<p><strong>Ocena ${f.points.reduce((x,y)=>x+y,0)}/20:</strong> ${esc(f.comment)}</p>`).join('')}<button data-area="${a.id}">Przejdź do zagadnienia</button></div>`}).join('')}</div><h2>Historia odpowiedzi i poprawek</h2><div class="stack">${[...D.exercises.map(e=>e.id),'DIAG-01'].map(id=>{let a=answer(id);return `<div class="panel"><strong>${esc(id)}</strong> · ${a.body||a.thesis?'Rozpoczęto':'Jeszcze nie badano'} · ${a.status==='ready'?'Gotowe':'Wersja robocza'}<p class="status">Liczba zachowanych wcześniejszych wersji: ${(a.revisions||[]).length} · ${esc(a.updated||'')}</p><button data-task="${id}">Otwórz</button>${feedbackFor(id)}</div>`}).join('')}</div>`}
function render(){let root=$('#app');root.innerHTML=view==='start'?start():view==='areas'?areasPage():view==='library'?library():view==='glossary'?glossary():view==='workshop'?workshop():view==='diagnostic'?editor('DIAG-01'):view==='progress'?progress():editor(selectedTask);root.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{area=Number(b.dataset.area);state.lastArea=area;persist();nav('areas')});root.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{selectedTask=b.dataset.task;nav('editor')});if($('#continue'))$('#continue').onclick=()=>{area=state.lastArea||1;nav('areas')};if($('#areaSelect'))$('#areaSelect').onchange=e=>{area=Number(e.target.value);state.lastArea=area;persist();render()};if($('#searchLibrary')){$('#searchLibrary').oninput=e=>renderLibrary(e.target.value);renderLibrary()};if($('#termSearch')){$('#termSearch').oninput=e=>terms(e.target.value);terms()};if($('#backUp'))$('#backUp').onclick=()=>download(state,'OLiJP_Madzia_kopia.json');if(['editor','diagnostic'].includes(view))wireEditor(view==='diagnostic'?'DIAG-01':selectedTask);}
function wireEditor(id){const fields=[...document.querySelectorAll('[data-field]')];let current=answer(id);let timer;const capture=()=>{let o={...answer(id)};for(let f of fields)o[f.dataset.field]=f.value;return o};const counts=()=>$('#counter').textContent=wordCount($('#body').value)+' słów';counts();const commit=(ready=false)=>{let old=answer(id),newA=capture();const changed=['body','thesis','evidence','interpretation','counter','source'].some(k=>(old[k]||'')!==(newA[k]||''));if(changed&&(old.body||old.thesis||old.evidence)){newA.revisions=[...(old.revisions||[]),{date:old.updated||stamp(),body:old.body||'',thesis:old.thesis||'',evidence:old.evidence||'',interpretation:old.interpretation||'',counter:old.counter||'',source:old.source||''}].slice(-20)}newA.status=ready?'ready':(changed&&old.status==='ready'?'draft':old.status||'draft');newA.updated=stamp();state.answers[id]=newA;persist();$('#editStatus').textContent=newA.status==='ready'?'Gotowe do oceny':'Wersja robocza';$('#draftSave').textContent='Zapisano '+new Date().toLocaleTimeString('pl-PL');$('#dirty').textContent='';return newA};fields.forEach(f=>f.addEventListener('input',()=>{dirty=true;counts();$('#dirty').textContent='Zmiany oczekują na zapis…';clearTimeout(timer);timer=setTimeout(()=>commit(false),750)}));$('#saveDraft').onclick=()=>{clearTimeout(timer);commit(false)};$('#ready').onclick=()=>{clearTimeout(timer);let a=commit(true);if(!a.body.trim()&&!a.thesis.trim()){alert('Najpierw wpisz odpowiedź.');a.status='draft';persist();render();return}toast('Odpowiedź oznaczona jako gotowa do oceny.')};$('#print').onclick=()=>{commit(false);window.print()};$('#exportOne').onclick=()=>{commit(false);download(state,'OLiJP_Madzia_przekazanie.json')}}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});persist();nav('start');
</script></body></html>
