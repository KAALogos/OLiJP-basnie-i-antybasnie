function checkedText(s){return String(s||'').slice(0,300000)}
function validFields(f){if(!f||typeof f!=='object'||Array.isArray(f))return false;return Object.keys(f).every(k=>['body','teza','dowod','interpretacja','kontrargument','source'].includes(k)&&typeof f[k]==='string'&&f[k].length<=300000)}
function validAnswers(o){if(!o||typeof o!=='object'||Array.isArray(o)||Object.keys(o).length>20)return false;return Object.entries(o).every(([id,a])=>allowedIds.includes(id)&&a&&typeof a==='object'&&['draft','ready','assessed','rework','corrected'].includes(a.status)&&validFields(a.fields)&&(!a.revisions||(Array.isArray(a.revisions)&&a.revisions.length<=300&&a.revisions.every(v=>v&&validFields(v.fields)&&['draft','ready','assessed','rework','corrected'].includes(v.status)))))}
function validReview(r){return !!(r&&typeof r==='object'&&typeof r.id==='string'&&r.id.length<100&&allowedIds.includes(r.taskId)&&Array.isArray(r.scores)&&r.scores.length===6&&r.scores.every((x,i)=>Number.isInteger(x)&&x>=0&&x<=gradesMax[i])&&r.feedback&&typeof r.feedback==='object'&&['success','issue','evidence','next','note'].every(k=>typeof r.feedback[k]==='string'&&r.feedback[k].length<=20000)&&typeof r.createdAt==='string')}
const STATUS={draft:'W trakcie',ready:'Gotowa do oceny',assessed:'Oceniona',rework:'Do poprawy',corrected:'Poprawiona'};

const UX={"intro":"Wybierz zagadnienie, przeczytaj wskazaną scenę i napisz, jak ją rozumiesz. Możesz wrócić do szkicu w dowolnym momencie. Po ocenie nauczyciela poprawisz tekst i porównasz obie wersje.","topics":[{"problem":"Po czym poznajemy baśń: po czarach, po przebiegu zdarzeń czy po sposobie opowiadania? Sprawdź, jak działają próba, pomoc i zakończenie.","example":"W „O rybaku i jego żonie” braci Grimm kolejne życzenia prowadzą do utraty wszystkiego, co bohaterowie otrzymali. Zobacz, jak finał zmienia sens wcześniejszych zdarzeń.","action":"Wskaż po jednym zdarzeniu, które rozpoczyna problem, zmienia sytuację i rozstrzyga opowieść.","warning":"Odczytano niemiecki tekst z 1819 roku. Nie potwierdzono jeszcze wszystkich różnic względem polskiego wydania.","terms":["Baśń","Funkcja narracyjna","Cudowność"]},{"problem":"Ta sama tradycja baśniowa może być opowiadana na różne sposoby w różnych epokach. Co pozostaje, a co zmienia się u kolejnych autorów?","example":"Porównaj „Królewnę Śnieżkę” Grimmów z „Cieniem” Andersena. W pierwszym przypadku badamy określoną wersję opowieści ludowej; w drugim — autorski utwór o władzy i oszustwie.","action":"Wybierz dwa utwory z różnych epok. Zapisz jedną wspólną cechę i jedną ważną różnicę w sposobie opowiadania.","warning":"Dysponujemy tekstem Grimmów z 1819 roku i duńskim oryginałem Andersena. Nie należy uznawać ich za identyczne z polskimi przekładami.","terms":["Baśń literacka","Baśniowość","Bajka"]},{"problem":"Skąd bohaterowie wiedzą, co jest prawdą? Czy sama prawda wystarcza, by inni zmienili swoje zachowanie?","example":"W „Nowych szatach cesarza” nikt nie widzi niezwykłej tkaniny, bo ona nie istnieje. Mimo to dorośli podtrzymują kłamstwo, nawet gdy dziecko nazywa rzeczy po imieniu.","action":"Napisz, dlaczego dwór trwa przy oszustwie. Dodaj argument, który mógłby podważyć twoje wyjaśnienie.","warning":"Przykład opiera się na duńskim oryginale. O innych, udostępnionych tylko we fragmentach utworach nie wyciągamy wniosków dotyczących zakończeń.","terms":["Cudowność","Narrator niewiarygodny","Satyra"]},{"problem":"Bohater, narrator i czytelnik mogą inaczej rozumieć te same wydarzenia. Czy baśń potrafi pokazać, jak trudno poznać cudzy punkt widzenia?","example":"W „Majce” Leśmiana Marcin otrzymuje zieloną księgę, choć nie umie jej przeczytać. To, co widzi i sądzi, nie musi wyczerpywać prawdy o Majce.","action":"Wybierz fragment „Majki”. Rozdziel to, co stwierdza narrator, od tego, co sądzi Marcin.","warning":"Dostępny tekst „Majki” opiera się na wydaniu PAX z 1978 roku. Nie potwierdzono jeszcze zgodności z zalecanym wydaniem z 1959 roku.","terms":["Narrator niewiarygodny","Sprawczość","Symbol"]},{"problem":"Niektóre obrazy powracają w wielu opowieściach. Czy powtarzający się motyw wystarczy, aby uznać go za archetyp w rozumieniu Junga?","example":"W „Cieniu” Andersena cień odłącza się od człowieka i zaczyna działać samodzielnie. Można zapytać, czy symbolizuje ukrytą część osobowości — ale to dopiero hipoteza, a nie ustalenie.","action":"Zapisz dwie możliwości odczytania cienia: psychologiczną i społeczną. Wskaż, czego trzeba jeszcze dowieść.","warning":"Uwaga: nie zweryfikowano w tekstach Junga i Campbella takich interpretacji konkretnych utworów. Zbieżność motywów nie dowodzi istnienia archetypu.","terms":["Archetyp","Motyw","Symbol"]},{"problem":"Różne teorie baśni zadają różne pytania. Która pomaga zrozumieć wybraną scenę, a czego nie potrafi wyjaśnić?","example":"„Cień” Andersena można badać przez działania postaci (Propp) albo przez dialog z regułami baśni (Kostecka). Obie metody pokazują coś innego; żadna nie jest uniwersalnym kluczem.","action":"Wybierz jedną scenę „Cienia” i dwie teorie. Dla każdej napisz: co wyjaśnia, a czego nie wyjaśnia.","warning":"Podstawy pięciu teorii są udokumentowane w różnym stopniu. Jung, Campbell i część innych opracowań wymagają dalszej weryfikacji.","terms":["Funkcja narracyjna","Baśniowość","Antybaśń"]},{"problem":"Czy baśniowe zdarzenia mogą organizować dramat lub powieść, które same nie są baśniami? Jak sprawdzić ich rolę w całej historii?","example":"W „Ofierze królewny” Lemańskiego występują podróż, pomoc zwierzęcia i próby bohaterów. Można zbadać, czy układ baśniowy współistnieje z satyrą.","action":"Rozpisz etapy podróży w „Ofierze królewny”. Sprawdź także możliwość, że to przede wszystkim utwór satyryczny.","warning":"Transkrypcja „Ofiary królewny” wymaga sprawdzenia wydania. Pełny tekst „Skrzypka Opętanego” i powieści Raka nie został w tym projekcie odczytany.","terms":["Baśniowość","Satyra","Groteska"]},{"problem":"Kiedy autor wykorzystuje znany schemat baśni po to, aby zakwestionować jego zasady? Sam smutny finał jeszcze nie czyni utworu antybaśnią.","example":"W „Cieniu” Andersena oszust osiąga sukces i poślubia królewnę, a uczony ginie. Zakończenie przypomina nagrodę z baśni, lecz przypada temu, kto postępuje nieuczciwie.","action":"Wskaż regułę baśni, którą „Cień” może podważać. Porównaj z karą w „O rybaku i jego żonie”.","warning":"Określenie „antybaśń” to w tym przypadku propozycja interpretacji, którą trzeba uzasadnić. Tragedia i kara występują również w klasycznych baśniach.","terms":["Antybaśń","Aksjologia","Satyra"]},{"problem":"Co zmienia się, gdy autor opowiada znaną baśń na nowo? Czy zmiana postaci oznacza także zmianę sensu całej historii?","example":"W udostępnionym fragmencie „Królewicza Śnieżka” szyje król, a nie królowa. To zamiana roli, ale nie wiemy jeszcze, jak działa ona w całym utworze.","action":"Zapisz, co naprawdę wiadomo o zmienionej wersji, co z tego interpretujesz i czego jeszcze nie można stwierdzić.","warning":"Znamy tylko fragment „Królewicza Śnieżka” i opis metody autorów. Nie potwierdzono pełnej wersji ani wszystkich relacji z pierwowzorem.","terms":["Retelling","Hipotekst","Intertekstualność"]}],"exercises":{"cw-01":"Porównaj zakończenia „O rybaku i jego żonie” i „Cienia”. Dlaczego w pierwszym utworze bohaterowie tracą to, co otrzymali, a w drugim wygrywa oszust? Odwołaj się do jednego wydarzenia z każdej opowieści. Przedstaw własny wniosek i kontrargument. Napisz 120–180 słów.","cw-02":"Czy „Nowe szaty cesarza” to antybaśń, czy raczej satyra? Podaj po dwa argumenty za każdą możliwością. Pamiętaj: niezwykła tkanina nie istnieje, oszuści tylko przekonują innych, że ją stworzyli.","cw-03":"Wybierz „Majkę” lub „Podlasiaka” Leśmiana. Znajdź dar albo próbę bohatera i wyjaśnij, czy dzięki temu zyskuje on większy wpływ na wydarzenia (sprawczość). Oddziel wypowiedź narratora od przekonania postaci.","cw-04":"Przyjrzyj się trzem miejscom w „Ofierze królewny”: początkowemu wyobrażeniu królewny o ukochanym, odrzuceniu pomocy kraski i epilogowi. Czy cała powieść podważa zasady baśni? Rozważ także inne wyjaśnienie. Nie traktuj słów Wezyra jak stanowiska autora.","cw-05":"W przeczytanych rozdziałach I–III „Baśni o wężowym sercu” znajdź trzy przykłady sformułowania „Powiadają”. Przy każdym zapisz, czy oznacza obserwację, plotkę, tradycję czy głos narratora. Na końcu wskaż, czego nie można powiedzieć o zakończeniu na podstawie tego fragmentu.","cw-06":"Rozważ zdanie: „Zamiana płci postaci przy zachowaniu fabuły może tworzyć postmodernistyczny retelling”. Podaj argument i kontrargument. Oddziel opis metody autorów „Królewicza Śnieżka” od wniosków, których nie pozwala potwierdzić dostępny fragment.","cw-07":"Wybierz jedną scenę „Cienia” Andersena. Porównaj dwie metody: Proppa i Kosteckiej ALBO Lüthiego i Bettelheima. Najpierw sprawdź w Bibliotece → Słownik i teorie, o co pyta każdy badacz. Następnie zastosuj oba pytania do tej samej sceny i pokaż, czego żadna z metod nie potrafi wyjaśnić.","cw-08":"Minirozprawka podsumowująca: czy baśń obiecuje sprawiedliwy porządek, czy odsłania, że taka sprawiedliwość może być pozorna? Odwołaj się do dwóch utworów, rozważ poważny kontrargument i zaznacz, na jakich źródłach opierasz swoją analizę. To ćwiczenie, nie wybór czterech utworów.","diag-01":"Rozprawka diagnostyczna: „Baśń może obiecywać sprawiedliwy porządek i jednocześnie pokazywać, jak jest on naruszany”. Czy zgadzasz się z tym zdaniem? Przeanalizuj dwa lub trzy utwory, w tym co najmniej jedno zakończenie. Przywołaj jedną teorię baśni, uwzględnij kontrargument i odróżnij głos narratora od słów bohaterów. Sugerowana objętość: 450–650 słów."},"glossary":{"Baśń":"Opowieść, w której zdarzenia niezwykłe są częścią świata przedstawionego.","Bajka":"Słowo o kilku znaczeniach; w teorii literatury może oznaczać krótki utwór z morałem.","Baśń literacka":"Baśń napisana przez konkretnego autora, który może zmieniać tradycyjne wzory.","Baśniowość":"Cechy znane z baśni, obecne również w innych gatunkach.","Cudowność":"Obecność zdarzeń, których nie potrafimy wyjaśnić zwykłymi prawami przyrody.","Antybaśń":"Utwór, który świadomie podważa konkretną zasadę tradycyjnej baśni.","Parafraza":"Opowiedzenie lub zapisanie cudzej wypowiedzi własnymi słowami.","Retelling":"Nowe opowiedzenie wcześniejszej, rozpoznawalnej historii.","Intertekstualność":"Związki między utworami, na przykład cytaty, aluzje i przekształcanie fabuły.","Hipotekst":"Wcześniejszy utwór, na którym opiera się późniejsza przeróbka.","Autotematyzm":"Sytuacja, gdy utwór mówi także o własnym tworzeniu lub opowiadaniu.","Archetyp":"W teorii Junga: wspólny wzorzec organizujący obrazy i wyobrażenia.","Motyw":"Powracający element opowieści, na przykład wędrówka, próba albo las.","Symbol":"Znak, który oprócz dosłownego sensu sugeruje inne znaczenia.","Funkcja narracyjna":"Rola danego działania postaci w przebiegu opowieści.","Aksjologia":"System wartości: co utwór pokazuje jako dobre, złe, słuszne lub niesłuszne.","Sprawczość":"Możliwość bohatera wpływania na bieg wydarzeń.","Narrator niewiarygodny":"Narrator, którego wersja wydarzeń budzi uzasadnione wątpliwości.","Groteska":"Celowe łączenie rzeczy dziwnych, śmiesznych, niepokojących lub sprzecznych.","Satyra":"Utwór ośmieszający wady ludzi, instytucji albo obyczajów."},"theories":{"Władimir Propp":"Bada, co robią postaci i jak ich działania budują fabułę.","Max Lüthi":"Bada sposób opowiadania i cechy stylu baśni.","Bruno Bettelheim":"Pyta, jakie lęki i konflikty może rozpoznawać dziecko podczas lektury.","Weronika Kostecka":"Bada, jak nowsze utwory rozmawiają z tradycją baśni i zmieniają jej reguły.","Janina Abramowska":"Pomaga odróżnić różne znaczenia „bajki”; jej badania nie dotyczą bezpośrednio baśni Grimmów."},"sourceFlags":[["[T]","Przeczytano cały tekst wskazanej wersji."],["[T-oryginał]","Przeczytano cały tekst w języku oryginału, nie jego polski przekład."],["[P]","Przeczytano tylko fragment; nie wolno wnioskować o nieznanej całości."],["[P/T]","Podstawą jest tekst dostępny w określonej edycji, ale nie porównano wszystkich wydań."],["[T/OCR]","Jest transkrypcja tekstu; wydanie lub zgodność skanu wymaga sprawdzenia."],["[B]","Informacja pochodzi z bibliografii lub omówienia, nie z pełnej lektury."],["[I]","To interpretacja, czyli wniosek wymagający uzasadnienia."],["[H]","To hipoteza, czyli pomysł do sprawdzenia."],["[N]","Nie ma jeszcze potwierdzenia w źródłach."],["[B/N], [I/H], [H/N]","Połączone oznaczenia: każdy człon zachowuje własne znaczenie."]],"idGroups":[["G","Grimmowie"],["A","Andersen"],["LK","Leśmian, „Klechdy polskie”"],["O","Orlińska"],["N","Niimi"],["P","Plackett / Fransman"],["M","powieści i dramaty"]]};
'use strict';
const KEY='olijp-madzia-student-v1';
function blank(){return {schema:'olijp-madzia-student',version:1,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),lastTopic:null,lastTask:null,answers:{},feedback:[]}};
let state=storage.get(KEY);if(!validateState(state))state=blank();
function validateState(x){return !!(x&&x.schema==='olijp-madzia-student'&&x.version===1&&(x.lastTopic===null||Number.isInteger(x.lastTopic)&&x.lastTopic>=1&&x.lastTopic<=9)&&validAnswers(x.answers)&&Array.isArray(x.feedback)&&x.feedback.length<=1000&&x.feedback.every(validReview))}
function persist(){state.updatedAt=new Date().toISOString();return storage.set(KEY,state)}
const view={page:'start',topic:1,task:'cw-01',libQuery:'',libTopic:'all',libTab:'works',glossQuery:'',glossMode:'terms',focus:false};
makeSidebar(false);
function go(page,id){if(page==='topic'){view.topic=Number(id)||1;view.page='topic';state.lastTopic=view.topic;persist()}else if(page==='task'){if(!allowedIds.includes(id)){toast('Nie rozpoznano ćwiczenia.');return}view.task=id;view.page='task';state.lastTask=id;persist()}else if(page==='diagnostic'){view.task='diag-01';view.page='task';state.lastTask='diag-01';persist()}else{view.page=page}view.focus=false;document.body.classList.remove('focus-mode');render();window.scrollTo(0,0)}
function meaningful(a){return !!a&&Object.values(a.fields||{}).some(v=>typeof v==='string'&&v.trim())}
function hasResponse(a){return !!(a&&a.fields&&typeof a.fields.body==='string'&&a.fields.body.trim())}
function lastActive(){if(state.lastTask&&meaningful(state.answers[state.lastTask]))return state.lastTask;return Object.entries(state.answers).filter(([id,a])=>meaningful(a)).sort((x,y)=>String(y[1].editedAt||'').localeCompare(String(x[1].editedAt||'')))[0]?.[0]||null}
function labelStatus(id){let a=state.answers[id];return meaningful(a)?(STATUS[a.status]||'W trakcie'):'Nierozpoczęta'}
function isSubmitted(a){return hasResponse(a)&&(a.status==='ready'||(a.status==='corrected'&&!!a.submittedAt&&a.submittedAt>=a.editedAt))}
function noteStatus(id){let a=state.answers[id];return `<span class="tag ${!meaningful(a)?'neutral':a.status==='rework'?'warn':''}">${h(labelStatus(id))}</span>`}
function attemptForTopic(t){return t.exercises.some(id=>hasResponse(state.answers[id]))}
function answer(id){return state.answers[id]||{status:'draft',fields:{body:'',source:'',teza:'',dowod:'',interpretacja:'',kontrargument:''},revisions:[]}}
function countStarted(){return Object.values(state.answers).filter(a=>Object.values(a.fields||{}).some(x=>x.trim())).length}
function countReady(){return Object.values(state.answers).filter(a=>a.status==='ready').length}
function statBadge(id){return noteStatus(id)}
function viewTitle(title,kicker,lead){return `<header class="hero"><div class="eyebrow">${h(kicker)}</div><h1>${h(title)}</h1>${lead?`<p class="lead">${h(lead)}</p>`:''}</header>`}
function home(){const previous=lastActive(), lastTask=[...DATA.exercises,DATA.diagnostic].find(x=>x.id===previous), todo=DATA.exercises.find(x=>!meaningful(state.answers[x.id]))||DATA.exercises[0];return `${viewTitle('Dzisiaj','OLiJP · Samodzielna praca',UX.intro)}<div class="welcome card"><div><div class="eyebrow">Najprostszy kolejny krok · UX 8 / stabilizacja XV</div><h2>${lastTask?'Wróć do rozpoczętej pracy':'Rozpocznij pierwsze ćwiczenie'}</h2><p>${h(lastTask?lastTask.title:todo.title)}</p><p class="small">${h(lastTask?labelStatus(lastTask.id):'Wybierz zagadnienie, przeanalizuj przykład i napisz własną odpowiedź.')}</p><button class="btn primary" data-go="${lastTask?'task':'topic'}" ${lastTask?`data-task="${lastTask.id}"`:'data-topic="1"'}>${lastTask?'Wróć do szkicu →':'Otwórz pierwsze zagadnienie →'}</button></div><div class="kpi" aria-label="Zagadnień w programie">9 <span class="kpi-label">zagadnień</span></div></div><section class="section"><div class="section-heading"><h2>Moja praca</h2><button class="btn sm" data-go="works">Wszystkie prace →</button></div><div class="grid3"><div class="card"><div class="kpi">${countStarted()}</div><div class="kpi-label">rozpoczętych</div></div><div class="card"><div class="kpi">${countReady()}</div><div class="kpi-label">gotowych do oceny</div></div><div class="card"><div class="kpi">${state.feedback.length}</div><div class="kpi-label">otrzymanych ocen nauczyciela</div></div></div></section><section class="section split"><div class="panel reading"><h2>Jak pracować?</h2><p>Przeczytaj scenę, zapisz własny wniosek i poprzyj go fragmentem tekstu. Potem sprawdź inne możliwe odczytanie.</p><details class="details"><summary>Dokładne zasady pracy</summary><p>${h(DATA.source.how)}</p></details><div class="actionrow"><button class="btn" data-go="topics">Wybierz zagadnienie</button><button class="btn" data-go="task" data-task="${todo.id}">Otwórz ćwiczenie →</button></div><p class="footnote">Informacja o stanie badań nie jest oceną Twojej wiedzy. Ocenę wpisuje wyłącznie nauczyciel.</p></div><div class="card"><h3>Możesz już przekazać pracę?</h3><p>W edytorze oznacz odpowiedź jako gotową i wybierz „Pobierz pracę dla nauczyciela”.</p><button class="btn" data-go="works">Przejdź do moich prac</button></div></section><details class="section details"><summary>Informacje o materiale i źródłach</summary><p>${h(DATA.source.contract)}</p><p>${h(DATA.source.status)}</p></details>`}
function topics(){return `${viewTitle('Zagadnienia','Dziewięć zagadnień olimpijskich','Wybierz temat. Na początku każdego znajdziesz pytanie badawcze, jeden przykład i propozycję pierwszego kroku.')}<div class="grid2">${DATA.topics.map(t=>`<button class="listcard" data-go="topic" data-topic="${t.id}"><span class="overline">Zagadnienie ${t.id}</span><strong>${h(t.title)}</strong><span class="small">${h(UX.topics[t.id-1].problem)}</span></button>`).join('')}</div>`}
function topic(){const t=DATA.topics[view.topic-1],u=UX.topics[view.topic-1],open=attemptForTopic(t),first=t.exercises[0],exercise=DATA.exercises.find(x=>x.id===first);return `${viewTitle(t.title,`Zagadnienie ${t.id} z 9`)}<div class="topic-top"><section class="panel reading"><div class="eyebrow">Problem do rozstrzygnięcia</div><p class="lead">${h(u.problem)}</p><h3>Przykład</h3><p>${h(u.example)}</p><div class="source-alert"><strong>Ważne przy korzystaniu ze źródeł:</strong> ${h(u.warning)}</div><div class="mini-legend"><strong>Jak czytać oznaczenia?</strong> A-03 to kod utworu „Cień” Andersena; G-15 to „O rybaku i jego żonie” Grimmów. [T] oznacza przeczytany pełny tekst określonego wydania, [P] tylko fragment, [H] hipotezę, [N] brak potwierdzenia. Dalsze oznaczenia wyjaśnia legenda poniżej. To stan badań, nie ocena Twojej wiedzy.</div>${uxFlags()}<h3>Teraz spróbuj</h3><p>${h(u.action)}</p><div class="actionrow"><button class="btn primary" data-go="task" data-task="${first}">Otwórz ${h(exercise?.title||'ćwiczenie')} i napisz odpowiedź →</button></div></section></div><section class="section panel">${uxContext(t)}</section><section class="section panel"><h2>Pomoc w trzech krokach</h2><p class="small">Najpierw sprawdź, co potrafisz ustalić samodzielnie. Wskazówki są dobrowolne.</p><details class="details"><summary>1. Pytanie naprowadzające</summary><p>${uxRead(t.questions)}</p></details><details class="details"><summary>2. Jak przeprowadzić analizę?</summary><p>Znajdź konkretną scenę albo wypowiedź. Zapisz, co się w niej dzieje. Wyjaśnij, jak ten fragment wpływa na sens utworu. Dopiero potem sformułuj wniosek.</p></details>${open?`<details class="details"><summary>3. Zobacz możliwą interpretację i kontrargument</summary><p class="small">To punkt wyjścia do dyskusji, nie odpowiedź do przepisania.</p><p><strong>Możliwy wniosek:</strong> ${uxRead(t.thesis)}</p><p><strong>Co może mu przeczyć?</strong> ${uxRead(t.counter)}</p></details>`:`<p class="small">Trzeci poziom otworzy się po zapisaniu Twojej własnej próby w jednym z ćwiczeń powiązanych z tym zagadnieniem.</p>`}</section><section class="section grid2"><div class="panel reading"><h2>Pełne opracowanie</h2><p class="small">Tu niczego nie skracamy: są szczegółowe pytania, przykłady, teorie i ograniczenia źródeł.</p><details class="details"><summary>Pełne ujęcie problemu</summary><p>${uxRead(t.problem)}</p></details><details class="details"><summary>Wszystkie przykłady literackie</summary><p>${uxRead(t.examples)}</p></details><details class="details"><summary>Pytania do pogłębionej analizy</summary><p>${uxRead(t.questions)}</p></details><details class="details"><summary>Oryginalne wskazówki badawcze i źródła</summary><p>${uxRead(t.source)}</p><p>${uxRead(t.status)}</p><div class="mini-heading">Co trzeba jeszcze sprawdzić?</div>${uxSteps(t.gap)}</details><details class="details"><summary>Lista źródeł i ich ograniczeń</summary>${sourcesFor(t.works)}</details></div><div class="panel"><h2>Ćwiczenia do tego zagadnienia</h2><div class="stack">${t.exercises.map(id=>{const e=DATA.exercises.find(x=>x.id===id);return `<button class="listcard" data-go="task" data-task="${id}"><strong>${h(uxTaskTitle(e))}</strong><span class="small">${h(labelStatus(id))}</span></button>`}).join('')}</div><details class="details" style="margin-top:15px"><summary>Pozostałe pojęcia i teorie</summary>${DATA.glossary.map(g=>uxGlossaryCard(g.term)).join('')}</details></div></section><button class="btn" data-go="topics">← Wróć do listy zagadnień</button>`}

function libraryCatalogue(){let q=view.libQuery.toLocaleLowerCase('pl'),topic=view.libTopic;let items=DATA.library.filter(w=>(topic==='all'||w.topics.includes(Number(topic)))&&[w.id,w.title,w.author,w.topics.map(t=>DATA.topics[t-1].title).join(' ')].join(' ').toLocaleLowerCase('pl').includes(q));return `${viewTitle('Biblioteka utworów','Zasoby rzeczywiście przywołane w MVP','To lista utworów wykorzystanych w ćwiczeniach, a nie pełny katalog ani lista wybranych lektur.')}<div class="filters"><input id="libSearch" class="search" aria-label="Szukaj utworu" placeholder="Szukaj: tytuł, autor, ID, zagadnienie…" value="${h(view.libQuery)}"><select id="libTopic" aria-label="Filtr zagadnienia"><option value="all">Wszystkie zagadnienia</option>${DATA.topics.map(t=>`<option value="${t.id}" ${view.libTopic===String(t.id)?'selected':''}>${t.id}. ${h(t.title)}</option>`).join('')}</select></div><div class="small" id="libCount">${items.length} rekordów udokumentowanych w trzech dokumentach MVP; zamrożony katalog projektu liczy 90 pozycji.</div><div class="grid2 section" id="libResults">${items.map(w=>`<article class="card library-item"><div class="eyebrow">${h(w.period)} · kod: ${h(w.id)}</div><h3>${h(w.title)}</h3><div class="small">${h(w.author)}</div><div><span class="small">Jak dobrze znamy źródło: ${h(w.status)}</span></div><p><strong>Na co zwrócić uwagę:</strong> ${uxRead(w.scenes)}</p><details class="details"><summary>Źródła, kwestie do sprawdzenia i powiązane zagadnienia</summary><p>${h(w.source)}</p><p><strong>Czego jeszcze nie wiemy:</strong> ${uxRead(w.unknown)}</p><p><strong>Zagadnienia:</strong> ${w.topics.map(n=>n+'. '+h(DATA.topics[n-1].title)).join('; ')}</p></details><div>${w.url?`<a href="${h(w.url)}" target="_blank" rel="noopener noreferrer">Otwórz potwierdzone źródło ↗</a>`:'<span class="small">Tekst tylko w dokumentacji archiwalnej projektu</span>'} ${w.extraUrl?`<span class="small"> · </span><a href="${h(w.extraUrl)}" target="_blank" rel="noopener noreferrer">Opis metody ↗</a>`:''}</div></article>`).join('')||'<p>Brak wyników. Zmień kryteria wyszukiwania.</p>'}</div><div class="footnote">Biblioteka aplikacji zawiera 14 opisanych pozycji. Pełny katalog badawczy liczy 90 utworów. Nie uzupełniamy brakujących informacji domysłami.</div>`}
function library(){return `<div class="subnav" aria-label="Zasoby biblioteki"><button data-action="libTab" data-tab="works" class="${view.libTab==='works'?'active':''}">Utwory i źródła</button><button data-action="libTab" data-tab="gloss" class="${view.libTab==='gloss'?'active':''}">Słownik i teorie</button></div>${view.libTab==='works'?libraryCatalogue():glossary()}`}
function glossary(){let q=view.glossQuery.toLocaleLowerCase('pl'),items=DATA.glossary.filter(x=>[x.term,x.definition,UX.glossary[x.term]||''].join(' ').toLocaleLowerCase('pl').includes(q));return `${viewTitle('Słownik i teorie','Pomoc do czytania i pisania','Najpierw krótkie znaczenie. Po rozwinięciu znajdziesz dokładniejsze wyjaśnienie i granice użycia pojęcia.')}<div class="subnav"><button data-glossmode="terms" class="${view.glossMode==='terms'?'active':''}">Słownik pojęć</button><button data-glossmode="models" class="${view.glossMode==='models'?'active':''}">Pięć sposobów badania baśni</button></div>${view.glossMode==='terms'?`<input id="glossSearch" class="search" placeholder="Wyszukaj pojęcie…" aria-label="Szukaj pojęcia" value="${h(view.glossQuery)}"><div class="grid2 section">${items.map(x=>`<article class="card"><h3>${h(x.term)}</h3><p>${h(UX.glossary[x.term]||x.definition)}</p><details class="details"><summary>Dokładniejsze wyjaśnienie</summary><p>${h(x.definition)}</p></details></article>`).join('')||'Nie znaleziono pojęcia.'}</div>`:`<div class="stack">${DATA.theories.map(t=>`<article class="card reading"><h3>${h(t.name)}</h3><p class="lead">${h(UX.theories[t.name])}</p><details class="details"><summary>Co wyjaśnia ta metoda, a czego nie?</summary><p><strong>Pytanie:</strong> ${uxRead(t.question)}</p><p><strong>Zastosowanie:</strong> ${uxRead(t.application)}</p><p><strong>Mocna strona:</strong> ${h(t.strength)}</p><p><strong>Ograniczenie:</strong> ${h(t.limit)}</p><p><strong>Stan źródeł:</strong> ${h(t.status)}</p></details></article>`).join('')}</div><div class="source-alert">${h(DATA.otherTheory)}</div>`}<details class="section details"><summary>Analiza czterech scen — fakty, interpretacje i zastrzeżenia</summary><div class="grid2">${DATA.scenes.map(s=>`<article class="card"><h3>${h(s.title)}</h3><p>${uxRead(s.fact)}</p><details class="details"><summary>Jak można to rozumieć?</summary><p>${uxRead(s.interpretation)}</p><p>${uxRead(s.challenge)}</p></details></article>`).join('')}</div></details><details class="section details"><summary>Trzy dokładne metody analizy</summary>${DATA.methods.map(m=>`<details class="details"><summary>${h(m.title)}</summary><p>${h(m.text)}</p></details>`).join('')}</details>`}
function workshop(){return works()}

function works(){return `${viewTitle('Moje prace','Szkice, przekazane prace i poprawki','Wybierz ćwiczenie. Każdą rozpoczętą pracę możesz kontynuować bez utraty tekstu.')}<div class="grid2">${[...DATA.exercises,DATA.diagnostic].map(e=>`<button class="listcard" data-go="task" data-task="${e.id}"><span class="overline">${h(labelStatus(e.id))}</span><strong>${h(uxTaskTitle(e))}</strong><span class="small">${h(UX.exercises[e.id]||e.prompt)}</span><span class="small">${meaningful(state.answers[e.id])?`${words(Object.values(state.answers[e.id].fields).join(' '))} słów`:''}</span></button>`).join('')}</div><div class="section panel"><h3>Wczytaj ocenę nauczyciela</h3><p>Wybierz otrzymany plik. Odpowiedzi zostaną zachowane, a do właściwego ćwiczenia dołączona będzie informacja zwrotna.</p><div class="actionrow"><button class="btn primary" data-action="import">Wczytaj ocenę</button><button class="btn" data-action="export">Pobierz kopię bezpieczeństwa</button></div></div>`}
function fieldRow(key,label,a,large=false){return `<div class="field"><div class="labelrow"><label for="field-${key}">${h(label)}</label>${key==='body'?'<span id="bodyWords" class="count">0 słów</span>':''}</div><textarea id="field-${key}" class="${large?'long':''}" data-answer-field="${key}" spellcheck="true">${h(a.fields[key]||'')}</textarea></div>`}
function taskPage(){let e=DATA.exercises.find(x=>x.id===view.task)||DATA.diagnostic,diag=e.id==='diag-01',a=answer(e.id),revs=a.revisions||[],fbs=state.feedback.filter(f=>f.taskId===e.id).slice().reverse(),canSend=hasResponse(a),afterCorrection=a.status==='corrected';return `<header class="hero editor-hero"><div class="eyebrow">${diag?'Rozprawka diagnostyczna':'Ćwiczenie interpretacyjne'} · ${h(labelStatus(e.id))}</div><h1>${h(uxTaskTitle(e))}</h1><p class="lead">${h(UX.exercises[e.id]||e.prompt)}</p><details class="details task-instructions"><summary>Pełne polecenie (oryginalne wymagania)</summary><p>${uxRead(e.prompt)}</p></details></header><div class="editor-toolbar"><div><span class="tag" id="currentStatus">${h(labelStatus(e.id))}</span><span class="count" id="saveStatus" role="status" aria-live="polite">${storageOK?'Zapis lokalny aktywny':'Zapis lokalny niedostępny — pobierz kopię'}</span></div><div class="actionrow"><button class="btn sm" data-action="toggleFocus" aria-pressed="${view.focus}">${view.focus?'Wyjdź z trybu skupienia':'Tryb skupienia'}</button><button class="btn sm" data-action="toggleSources" aria-controls="context-sources" aria-expanded="false">Materiały źródłowe</button></div></div><div class="editor-layout"><div class="panel writing-panel">${diag?`<div class="caution"><strong>Kryteria wewnętrzne, nie kryteria Komitetu.</strong> ${h(e.method)}</div>`:''}<div class="field"><div class="labelrow"><label for="field-body">${diag?'Moja rozprawka':'Moja odpowiedź'}</label><strong id="bodyWords" class="count">${words(a.fields.body)} słów</strong></div><textarea class="writing-area" id="field-body" data-answer-field="body" spellcheck="true" placeholder="Zacznij od fragmentu, który chcesz zinterpretować…">${h(a.fields.body||'')}</textarea></div><div class="labelrow"><span class="small">Zapis automatyczny na tym urządzeniu</span><span class="small" id="totalWords">${words(Object.values(a.fields).join(' '))} słów razem</span></div><details class="details" id="argument-notebook"><summary>Plan odpowiedzi (opcjonalnie)</summary><p class="small">Możesz użyć pól poniżej lub napisać całą odpowiedź bezpośrednio w edytorze.</p>${fieldRow('source','Z jakiego utworu i fragmentu korzystam?',a)}${diag?'':`${fieldRow('teza','Moja teza',a)}${fieldRow('dowod','Dowód z tekstu',a)}${fieldRow('interpretacja','Interpretacja dowodu',a)}${fieldRow('kontrargument','Kontrargument',a)}`}</details><div class="actionrow"><button class="btn primary" data-action="ready" ${!canSend?'disabled':''}>${afterCorrection?'Przekaż poprawioną pracę':'Gotowa do oceny'}</button><button class="btn" data-action="exportWork" ${!isSubmitted(a)?'disabled':''}>Pobierz pracę dla nauczyciela</button><button class="btn" data-action="import">Wczytaj ocenę</button><button class="btn" data-action="print">Drukuj / PDF</button></div><p class="small">Pobranie pliku nie wysyła go automatycznie. Przekaż plik nauczycielowi. Oceny nie powstają bez jego działania.</p>${fbs.length?`<section class="section" id="teacher-review"><h3>Informacja zwrotna od nauczyciela</h3>${fbs.map(feedbackCard).join('')}</section>`:''}${revs.length?`<details class="details" id="version-history"><summary>Wcześniejsze wersje (${revs.length}) i porównanie</summary><div class="actionrow"><button class="btn sm" data-action="compare">Porównaj wersję pierwotną i poprawioną</button></div><div id="versionComparison" class="hidden"></div><div class="timeline">${revs.slice().reverse().map((r,i)=>`<article><p class="small">${fmt(r.at)} · ${h(STATUS[r.status]||r.status)} · ${words(r.fields?.body||'')} słów</p><p class="version-text">${h(r.fields?.body||'—')}</p></article>`).join('')}</div></details>`:''}</div><aside class="editor-context" id="context-sources"><div class="card"><h3>Materiał źródłowy</h3>${sourcesFor(e.works||[])}<details class="details"><summary>Szczegółowe polecenie</summary><p>${uxRead(e.prompt)}</p></details></div>${diag?`<div class="card"><h3>Po napisaniu</h3><p>${h(e.after)}</p></div>`:`<div class="card"><h3>Powiązane zagadnienia</h3>${e.topics.map(n=>`<button class="btn sm" style="margin:3px" data-go="topic" data-topic="${n}">${n}. ${h(DATA.topics[n-1].title)}</button>`).join('')}</div>`}<div class="card"><h3>Objaśnienia pojęć</h3>${[...new Set((e.topics||[]).flatMap(n=>UX.topics[n-1]?.terms||[]))].slice(0,5).map(uxGlossaryCard).join('')}<p class="small">Wszystkie 20 pojęć i pięć teorii znajdziesz w Biblioteka → Słownik i teorie.</p><button class="btn sm" data-go="library">Otwórz bibliotekę</button></div><div class="card"><h3>Pomoc w interpretacji</h3><details class="details"><summary>1. Pytanie naprowadzające</summary><p>${uxRead(DATA.topics[(e.topics?.[0]||1)-1].questions)}</p></details><details class="details"><summary>2. Podpowiedź metodologiczna</summary><p>Znajdź fragment tekstu. Napisz, co w nim dostrzegasz i dlaczego jest ważny dla całej opowieści.</p></details>${hasResponse(a)?`<details class="details"><summary>3. Możliwy kierunek interpretacji — ujawnij świadomie</summary><p>${uxRead(DATA.topics[(e.topics?.[0]||1)-1].thesis)}</p><p>${uxRead(DATA.topics[(e.topics?.[0]||1)-1].counter)}</p></details>`:'<p class="small">Kierunek interpretacji i kontrargument pojawią się po zapisaniu własnej próby.</p>'}</div></aside></div>`}
function versionDetails(f){let keys={source:'Źródło i lokalizator',teza:'Teza',dowod:'Dowód',interpretacja:'Interpretacja',kontrargument:'Kontrargument'};let body=Object.entries(keys).filter(([k])=>f?.[k]?.trim()).map(([k,label])=>`<div class="details"><strong>${label}</strong><p class="version-text">${h(f[k])}</p></div>`).join('');return body?`<details class="details"><summary>Notatki i podstawa źródłowa</summary>${body}</details>`:''}
function compareVersions(){let id=currentTask(),a=state.answers[id],old=a?.revisions?.[0];if(!old){toast('Brak wcześniejszej wersji do porównania.');return}let v=$('#versionComparison');v.innerHTML=`<div class="compare-grid"><div><h3>Pierwotna odpowiedź</h3><p class="version-text">${h(old.fields.body||'—')}</p>${versionDetails(old.fields)}</div><div><h3>Obecna wersja</h3><p class="version-text">${h(a.fields.body||'—')}</p>${versionDetails(a.fields)}</div></div>`;v.classList.remove('hidden')}

function feedbackCard(r){let points=r.taskId==='diag-01'?`<span class="tag">${r.scores.reduce((a,b)=>a+b,0)}/20 · ocena wewnętrzna</span>`:'';return `<div class="card" style="margin-bottom:11px"><div class="labelrow"><strong>${h(r.taskId==='diag-01'?'Rozprawka diagnostyczna':DATA.exercises.find(e=>e.id===r.taskId)?.title||r.taskId)}</strong>${points}</div><p class="small">${fmt(r.createdAt)} · <strong>Decyzja nauczyciela:</strong> ${h(r.decision==='rework'?'Do poprawy':'Oceniona')}</p><p><strong>Co wykazano:</strong> ${h(r.feedback.success||'Nie podano.')}</p><p><strong>Trudność:</strong> ${h(r.feedback.issue||'Nie podano.')}</p><p><strong>Dowód z pracy:</strong> ${h(r.feedback.evidence||'Nie podano.')}</p><p><strong>Następne zadanie:</strong> ${h(r.feedback.next||'Nie podano.')}</p>${r.feedback.note?`<p><strong>Uwagi:</strong> ${h(r.feedback.note)}</p>`:''}</div>`}
function progress(){return `${viewTitle('Postępy','Ocena tylko na podstawie prac','Odróżniamy prowadzone badania od sprawdzonych przez nauczyciela umiejętności.')}<div class="grid3"><div class="card"><div class="kpi">${countStarted()}</div><div class="kpi-label">rozpoczętych prac</div></div><div class="card"><div class="kpi">${countReady()}</div><div class="kpi-label">gotowych do oceny</div></div><div class="card"><div class="kpi">${state.feedback.length}</div><div class="kpi-label">rzeczywistych ocen</div></div></div><section class="section"><h2>Prace i informacje zwrotne</h2><div class="stack">${[...DATA.exercises,DATA.diagnostic].map(e=>`<div class="card"><div class="labelrow"><h3>${h(e.title)}</h3>${noteStatus(e.id)}</div><p class="small">${meaningful(state.answers[e.id])?`${words(Object.values(state.answers[e.id].fields).join(' '))} słów`:'Brak odpowiedzi'}</p><button class="btn sm" data-go="task" data-task="${e.id}">Otwórz pracę i ocenę →</button></div>`).join('')}</div></section><section class="section"><h2>Zagadnienia</h2>${DATA.topics.map(t=>{let ids=t.exercises,done=ids.filter(id=>meaningful(state.answers[id])),fb=state.feedback.filter(f=>ids.includes(f.taskId));return `<details class="details"><summary>${t.id}. ${h(t.title)} · ${done.length}/${ids.length} rozpoczęto · ${fb.length} ocen</summary><p>Stan materiału: ${h(t.status)}</p><p>Granica źródłowa: ${h(t.gap)}</p><button class="btn sm" data-go="topic" data-topic="${t.id}">Otwórz zagadnienie</button></details>`}).join('')}</section><section class="section panel"><h2>Kopie bezpieczeństwa i oceny</h2><p>Odpowiedzi zapisują się lokalnie na tym urządzeniu. Regularnie pobieraj kopię bezpieczeństwa, szczególnie przed zmianą przeglądarki lub komputera.</p><div class="actionrow"><button class="btn primary" data-action="export">Pobierz kopię bezpieczeństwa</button><button class="btn" data-action="import">Wczytaj ocenę</button></div><p class="small">Przy wczytaniu pełnej kopii aplikacja ostrzega przed nadpisaniem obecnych prac. Plik z oceną nie nadpisuje odpowiedzi.</p></section>`}
function render(){setNav(view.page==='topic'?'topics':view.page==='task'?'works':view.page);let content={start:home,topics,topic,library,glossary,workshop,works,task:taskPage,diagnostic:()=>{view.task='diag-01';return taskPage()},progress}[view.page]||home;$('#app').innerHTML=content();if(['task','diagnostic'].includes(view.page))updateCounter();}
function updateCounter(){let a=answer(currentTask());let source=$('#bodyWords');if(source)source.textContent=words(a.fields.body)+' słów';let tot=$('#totalWords');if(tot)tot.textContent=words(Object.values(a.fields).join(' '))+' słów razem'}
function currentTask(){return view.page==='diagnostic'?'diag-01':view.task}
function writeField(el){let id=currentTask(),field=el.dataset.answerField;if(!allowedIds.includes(id)||!['body','source','teza','dowod','interpretacja','kontrargument'].includes(field))return;let a=state.answers[id]||answer(id);if(['ready','assessed','rework'].includes(a.status)){a.revisions=a.revisions||[];a.revisions.push({at:new Date().toISOString(),status:a.status,fields:{...a.fields}});a.status=a.status==='ready'?'draft':'corrected'}a.fields[field]=checkedText(el.value);a.editedAt=new Date().toISOString();state.answers[id]=a;state.lastTask=id;let okay=persist(),st=$('#saveStatus');if(st)st.textContent=okay?'Zapisano '+new Date().toLocaleTimeString('pl-PL'):'Nie zapisano! Pobierz kopię bezpieczeństwa.';updateCounter();const btn=$('[data-action="ready"]');if(btn){btn.disabled=!hasResponse(a);btn.textContent=a.status==='corrected'?'Przekaż poprawioną pracę':'Gotowa do oceny'}let exportButton=$('[data-action="exportWork"]');if(exportButton)exportButton.disabled=!isSubmitted(a);if(a.revisions?.length&&!$('#version-history')){let section=document.createElement('details');section.className='details';section.id='version-history';section.innerHTML=`<summary>Wcześniejsze wersje (${a.revisions.length}) i porównanie</summary><div class="actionrow"><button class="btn sm" data-action="compare">Porównaj wersję pierwotną i poprawioną</button></div><div id="versionComparison" class="hidden"></div>`;$('.writing-panel')?.appendChild(section)}let status=$('#currentStatus');if(status)status.textContent=labelStatus(id);let header=$('.editor-hero .eyebrow');if(header)header.textContent=(id==='diag-01'?'Rozprawka diagnostyczna':'Ćwiczenie interpretacyjne')+' · '+labelStatus(id)}
function exportWork(){const id=currentTask(),a=state.answers[id];if(!hasResponse(a)||!isSubmitted(a)){toast('Najpierw napisz odpowiedź i oznacz ją jako gotową do oceny.');return}const data={...state,answers:{[id]:a},feedback:[]};download({kind:'olijp-student-backup',version:1,exportedAt:new Date().toISOString(),data},'OLiJP_praca_'+id+'_'+new Date().toISOString().slice(0,10)+'.json');toast('Pobrano pracę. Przekaż plik nauczycielowi.')}
function exportStudent(){download({kind:'olijp-student-backup',version:1,exportedAt:new Date().toISOString(),data:state},'OLiJP_kopia_bezpieczenstwa_'+new Date().toISOString().slice(0,10)+'.json');toast('Pobrano kopię bezpieczeństwa.');}
async function importStudent(file){if(!file)return;try{let x=await readJSON(file);if(x?.kind==='olijp-student-backup'&&x.version===1&&validateState(x.data)){if(!window.confirm('Wczytanie kopii bezpieczeństwa ZASTĄPI wszystkie obecne prace, wcześniejsze wersje i oceny na tym urządzeniu. Pobierz bieżącą kopię przed kontynuacją. Czy nadpisać dane?'))return;state=x.data;if(!persist())throw Error('Brak możliwości lokalnego zapisu.');toast('Kopia bezpieczeństwa wczytana pomyślnie.');go('works');return}if(x?.kind==='olijp-teacher-feedback'&&x.version===1&&Array.isArray(x.reviews)&&x.reviews.length<=1000&&x.reviews.every(validReview)){let seen=new Set(state.feedback.map(f=>f.id)),incoming=x.reviews.filter(r=>!seen.has(r.id));if(!incoming.length){toast('W tym pliku nie ma nowych ocen.');return}if(!window.confirm(`Wczytać ${incoming.length} ocen nauczyciela? Twoje teksty pozostaną bez zmian.`))return;state.feedback.push(...incoming);for(let r of incoming){let a=state.answers[r.taskId];if(!a||!meaningful(a))continue;if(a.editedAt && r.studentUpdatedAt && a.editedAt!==r.studentUpdatedAt)continue;if(a.status==='ready'||a.status==='corrected'){a.status=r.decision==='rework'?'rework':'assessed';a.reviewedAt=r.createdAt}}if(!persist())throw Error('Nie udało się zapisać otrzymanych ocen.');toast(`Wczytano ${incoming.length} ocen nauczyciela.`);go('works');return}throw Error('Nieprawidłowy format lub struktura pliku.')}catch(e){toast('Nie udało się wczytać: '+e.message)}}
function printTask(){let e=[...DATA.exercises,DATA.diagnostic].find(x=>x.id===currentTask()),a=answer(e.id);$('#print-root').innerHTML=`<h1>OLiJP · ${h(e.title)}</h1><div class="small">${h(e.prompt)}</div><div class="print-task"><strong>Podstawa:</strong> ${h(a.fields.source||'—')}</div><h2>Odpowiedź</h2><div class="print-response">${h(a.fields.body||'Brak tekstu')}</div>${e.id!=='diag-01'?['teza','dowod','interpretacja','kontrargument'].map(k=>`<h3>${h(k)}</h3><div class="print-response">${h(a.fields[k]||'—')}</div>`).join(''):''}<p class="small">Wydruk: ${fmt(new Date().toISOString())}</p>`;document.body.classList.add('printing');window.print();}
window.addEventListener('afterprint',()=>{document.body.classList.remove('printing');$('#print-root').innerHTML=''})
let editedSinceLoad=false;window.addEventListener('beforeunload',e=>{if(!storageOK&&editedSinceLoad){e.preventDefault();e.returnValue=''}});
document.addEventListener('input',e=>{if(e.target.matches('[data-answer-field]')){editedSinceLoad=true;writeField(e.target)}if(e.target.id==='libSearch'){view.libQuery=e.target.value;let pos=e.target.selectionStart;$('#app').innerHTML=library();let input=$('#libSearch');input.focus();input.setSelectionRange(pos,pos)}if(e.target.id==='glossSearch'){view.glossQuery=e.target.value;let pos=e.target.selectionStart;$('#app').innerHTML=glossary();let input=$('#glossSearch');input.focus();input.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='libTopic'){view.libTopic=e.target.value;render()}if(e.target.id==='importFile'){importStudent(e.target.files[0]);e.target.value=''}});
document.addEventListener('click',e=>{let n=e.target.closest('[data-go]');if(n){go(n.dataset.go,n.dataset.topic||n.dataset.task);return}let mode=e.target.closest('[data-glossmode]');if(mode){view.glossMode=mode.dataset.glossmode;render();return}let a=e.target.closest('[data-action]');if(!a)return;switch(a.dataset.action){case 'toggleFocus':view.focus=!view.focus;document.body.classList.toggle('focus-mode',view.focus);a.textContent=view.focus?'Wyjdź z trybu skupienia':'Tryb skupienia';a.setAttribute('aria-pressed',String(view.focus));break;case 'toggleSources':{let box=$('#context-sources');if(box){box.classList.toggle('shown');a.setAttribute('aria-expanded',String(box.classList.contains('shown')))}break}case 'compare':compareVersions();break;case 'libTab':view.libTab=a.dataset.tab;render();break;case 'exportWork':exportWork();break;case 'save':persist();toast(storageOK?'Wersja robocza zapisana.':'Zapis lokalny niedostępny. Eksportuj plik JSON.');break;case 'ready':{let id=currentTask(),ans=answer(id);if(!hasResponse(ans)){toast('Najpierw napisz własną odpowiedź w głównym polu. Sama notatka o źródle nie wystarcza.');return}ans.status=ans.status==='corrected'?'corrected':'ready';ans.submittedAt=new Date().toISOString();state.answers[id]=ans;persist();toast('Praca przygotowana. Pobierz ją dla nauczyciela.');render();break}case 'export':exportStudent();break;case 'import':$('#importFile')?.click();break;case 'print':printTask();break;}});
render();
</script></body></html>
