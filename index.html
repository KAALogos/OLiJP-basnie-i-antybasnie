;margin:2px 0}.listcard .small{line-height:1.5}.listcard .overline{font-size:11px;letter-spacing:.12em;color:var(--accent);font-weight:700;text-transform:uppercase}.btn{border:1px solid var(--line);background:var(--white);color:var(--ink);border-radius:8px;padding:9px 13px;min-height:39px;font-size:13px;font-weight:650;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}.btn.primary:hover{filter:brightness(1.15)}:root[data-theme=dark] .btn.primary{background:#a2dcd8;border-color:#a2dcd8;color:#173034}.btn:hover{border-color:var(--accent)}.btn.ghost{background:transparent}.btn.sm{min-height:33px;padding:6px 10px}.btn[disabled]{opacity:.48;cursor:default}.actionrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:15px 0}.split{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:21px;align-items:start}.aside{position:sticky;top:92px}.aside .card{margin-bottom:15px}.reading p,.reading li{line-height:1.79}.reading{font-size:15px}.field{display:flex;flex-direction:column;gap:6px;margin:0 0 16px}.field label{font-size:12px;font-weight:700;letter-spacing:.025em}.field input,.field textarea,.field select,.search{background:var(--white);border:1px solid var(--line);border-radius:8px;width:100%;padding:11px 12px;min-width:0}.field textarea{resize:vertical;min-height:100px;line-height:1.66}.field textarea.long{min-height:260px}.field textarea.tall{min-height:470px}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}.fields2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 13px}.labelrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.meta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 17px}.separator{height:1px;background:var(--line);margin:25px 0}.footnote{font-size:13px;color:var(--sub);border-left:3px solid var(--line);padding:8px 0 8px 15px;line-height:1.65}.cautio <script>const DATA={"topics":[{"id":1,"title":"Baśń jako gatunek i model narracyjny","problem":"Trzeba osobno opisać fabułę (brak, wyruszenie, próba, pomoc, rozpoznanie, nagroda), zasady świata (status cudowności), głos narratora oraz sposób zamknięcia opowieści. Nie każdy utwór realizuje pełny schemat Proppa, nie każda magiczna ryba jest „darczyńcą” w jego ścisłym sensie.","examples":"G-15 „O rybaku i jego żonie”: rozmowy z rybą, narastanie żądań i powrót do punktu wyjścia [T-oryginał niemiecki 1819; karta XI]. LK-02 „Jan Tajemnik”: czerwone buty jako dar wymykający się spod kontroli [P/T, zapis karty]. M-01 „Ofiara królewny”: droga królewicza i Wezyra, zaoferowana pomoc kraski, epilog „SWOBODA” [T/OCR].","questions":"Czy funkcję daru definiuje jego nadnaturalność, czy rola w dalszych działaniach? Co w „Ofierze…” pozostaje z modelu wyprawy po upragnione dobro?","thesis":"Autor może zachować rekwizyty baśni, a zarazem przewartościować relacje między próbą i nagrodą.","counter":"Fabuła od początku mogła być satyrą filozoficzną, nie zaś „uszkodzoną” baśnią — trzeba wykazać działanie konwencji, nie tylko podobieństwo motywów.","source":"G-15 „Von dem Fischer un siine Fru”, KHM 19, red. 1819; LK-02 „Klechdy polskie” (Wolne Lektury); M-01 pełna transkrypcja archiwum X.","status":"[T-oryginał]/[P/T]/[T/OCR] + [I]; polskie kolacje [N].","works":["G-15","LK-02","M-01"],"exercises":["cw-01","cw-04","cw-07","cw-08"],"next":"Porównaj trzy funkcje narracyjne w G-15 i M-01","gap":"Propp [P], słownik Sławińskiego [B/N], polskie wydania bez kolacji"},{"id":2,"title":"Tradycje i formy baśni w literaturze różnych epok","problem":"Inaczej funkcjonuje utrwalona redakcja ludowej bajki magicznej, autorska opowieść XIX-wieczna, modernistyczna groteska, XX-wieczna baśń japońska czy współczesna powieść przetwarzająca folklor. Rozróżnij epokę utworu, czas formowania tradycji, gatunek i współczesny sposób lektury.","examples":"G-02 „Królewna Śnieżka” [T-oryginał 1819] jako zapis historycznej redakcji; A-03 „Cień” [T-oryginał duński] jako autorska opowieść o społecznej władzy; LK-03 „Majka” [P/T] jako groteskowo-folklorystyczna proza; M-03 „Baśń o wężowym sercu…” [P: tylko rozdziały I–III] jako współczesna opowieść o pamięci i przemocy pańszczyźnianej.","questions":"Który rodzaj wiedzy o świecie jest ważniejszy w każdej z tych form? Czym różni się wariant 1819 od współczesnego odczytania stereotypu?","thesis":"Historia baśni jest historią sposobów wykorzystania odziedziczonej konwencji, a nie prostą drogą od „naiwności” do „krytycyzmu”.","counter":"Tak szeroka perspektywa może zatrzeć różnicę między baśnią, podaniem, alegorią i powieścią; zawsze należy pokazać osobną strukturę tekstu.","source":"G-02 „Sneewittchen” KHM 53, 1819; A-03 oryginał duński; LK-03 Wolne Lektury (PAX 1978); M-03 opublikowane rozdziały I–III.","status":"[T-oryginał]/[P/T]/[P]; przekłady i pełny Rak [N].","works":["G-02","A-03","LK-03","M-03"],"exercises":["cw-01","cw-05","cw-07"],"next":"Zestaw dwa teksty z różnych epok i oddziel gatunek od konwencji","gap":"Vademecum [N]; dokładna filiacja przekładów [N]"},{"id":3,"title":"Baśń jako światopogląd i forma poznania rzeczywistości","problem":"Pytamy nie tylko o cud, lecz o to, SKĄD bohater i narrator „wiedzą”, co jest prawdą. Baśń może naturalizować reguły moralne, ujawniać kłamstwo, nadawać nazwy lękom lub pokazywać, jak społeczność produkuje fałszywą pewność.","examples":"A-05 „Nowe szaty cesarza”: nie ma cudownej tkaniny, dwór podtrzymuje pozór, dziecko nazywa nagość, a pochód trwa [T-oryginał duński]. A-03 „Cień”: zdobywanie kompromitujących sekretów nie równa się rozumieniu prawdy [T-oryginał]. M-03: „Powiadają” w historii o rusałkach [P]. O-03 „Smok”: wspólnota nazywa przeżywany lęk [P].","questions":"Czy publicznie wypowiedziana prawda musi zwyciężyć społecznie? Czy nazwanie smoka wyjaśnia zagrożenie, czy je upraszcza?","thesis":"Baśniowy sposób opowiadania pozwala analizować granicę między doświadczeniem, przekazem i autorytetem.","counter":"Nie każda figura cudowna koduje epistemologię: część ma funkcję komiczną albo przygodową; dowód tkwi w konkretnych relacjach narracyjnych.","source":"A-05 i A-03 oryginały duńskie; M-03 rozdz. I–III; O-03 początek (Virtualo).","status":"[T-oryginał]/[P]/[I]; finał O-03 [N].","works":["A-05","A-03","M-03","O-03"],"exercises":["cw-02","cw-04","cw-05","cw-08"],"next":"Napisz 150 słów o społecznej prawdzie w A-05 z kontrargumentem","gap":"Nieodczytane finały M-03 i O-03; pogłoska ≠ stanowisko narratora"},{"id":4,"title":"Baśń jako lustro jednostkowej wrażliwości","problem":"Tekst może ujawnić pragnienia, lęki i sposób patrzenia bohatera — lecz nie należy utożsamiać ich automatycznie z psychiką autora lub każdego dziecka. Ważne jest, KTO opowiada, kto widzi, a kogo głos zostaje pominięty.","examples":"LK-03 „Majka”: Marcin otrzymuje zieloną księgę, choć nie potrafi jej przeczytać; cielesność Majki postrzega przez własną miarę [P/T]. N-14 „Lisek Gon”: lis próbuje naprawić winę anonimowymi darami, człowiek rozpoznaje go za późno [T-oryginał japoński wg karty]. M-01: królewna pragnie ideału, zaś Wezyr interpretuje jej uczucia [T/OCR].","questions":"Co wiesz o Majce od narratora, a co wyłącznie od Marcina? Czy skrucha Gon wystarczyłaby, gdyby jego zamiar został rozpoznany?","thesis":"Baśń może pokazać dramat niedostępności cudzej perspektywy.","counter":"Wymóg „psychologicznej głębi” w tekście stylizowanym może być anachroniczny; najpierw wskaż konkretne pęknięcia perspektywy.","source":"LK-03 „Majka” ustępy 15–46 i 479–508; N-14 oryginał japoński Aozora; M-01 otwarcie i wypowiedzi Wezyra w OCR.","status":"[P/T], [T-oryginał], [T/OCR]; polski Niimi [N].","works":["LK-03","N-14","M-01"],"exercises":["cw-03","cw-04"],"next":"Porównaj dar dla Marcina i nieskuteczną naprawę winy lisa","gap":"Brak polskiej kolacji Niimiego; unikać równości bohater = narrator"},{"id":5,"title":"Baśń jako manifestacja archetypów zbiorowej nieświadomości","problem":"W perspektywie jungowskiej archetyp nie jest po prostu dowolnym powracającym przedmiotem. To pojęcie teoretyczne dotyczące wzorców organizujących wyobrażenia; obrazy cienia, lasu, wody i przemiany można sprawdzać jako możliwe manifestacje, ale samo ich wystąpienie nie dowodzi istnienia ani działania archetypu.","examples":"Przykłady badawcze, wyłącznie [H]: A-03 — usamodzielniony cień; M-03 — rusałki i nocny krajobraz; G-15 — morze i ryba jako figury granicy pragnienia. Dla tych przykładów brak odczytanej podstawy źródłowej Junga/Campbella [B/N]; nie przypisuj autorom cudzych analiz.","questions":"Jakiej dodatkowej przesłanki potrzeba, by od podobieństwa motywów przejść do interpretacji archetypicznej? Co lepiej wyjaśnia „Cień”: psychologiczny wzorzec czy społeczne mechanizmy kłamstwa?","thesis":"Powtarzalne figury mogą nadawać jednostkowemu konfliktowi znaczenie ponadindywidualne. [H]","counter":"Powtarzalność wynikać może z konwencji literackiej, przekazu kulturowego lub wspólnych warunków doświadczenia — niekoniecznie ze zbiorowej nieświadomości.","source":"A-03 oryginał duński; M-03 rozdz. I–III; G-15 1819. Jung „Archetypy i symbole” i Campbell „Bohater o tysiącu twarzy” — [B/N], niezweryfikowane twierdzenia.","status":"[H/N]; teorie archetypowe niezweryfikowane w zastosowaniach.","works":["A-03","M-03","G-15"],"exercises":["cw-07"],"next":"Napisz argument za i przeciw archetypiczności cienia","gap":"Jung/Campbell [B/N]; motyw nie dowodzi archetypu"},{"id":6,"title":"Różne teorie baśni","problem":"Modele odpowiadają na odrębne pytania: strukturalny „co robi postać?”, stylistyczny „jak opowiada narrator?”, psychoanalityczny „jakie konflikty może rozpoznać odbiorca?”, kulturowy „z jakim kanonem prowadzi dialog?”, folklorystyczny „jak utwór funkcjonuje w tradycji?”. Ich mechaniczne sklejenie daje pozorną wszechwiedzę.","examples":"Zastosuj do A-03 „Cień”: Propp — czy kariera oszusta wypełnia pozycję awansu? Lüthi — jak zmienia się styl cudowności wobec świata obyczaju? Bettelheim — czy niepocieszający finał mieści się w normie jego ujęcia? Kostecka — czy tekst przewartościowuje baśniowe sankcje (jako antycypacja późniejszych strategii, nie historyczny postmodernizm)?","questions":"Który model najwięcej wyjaśnia w scenie ślubu cienia, a gdzie każdy traci moc? Czy model opisowy może być jednocześnie normatywnym kryterium „dobrej baśni”?","thesis":"Spór o baśń często jest sporem o zakres pytań stawianych tekstowi, nie o pojedynczy „prawidłowy” klucz.","counter":"Metody nie są dowolnie wymienne: trzeba respektować ich korpus, czas i założenia.","source":"Propp „Morfologia bajki” polski skrót 1968/4 [P]; Lüthi „Style gatunkowe” 1973/1 [T]; Bettelheim esej 1975 [P], polski tom 1985 [B]; Kostecka 2014 [T]; Abramowska 1986/1 [T, tylko model bajki ezopowej].","status":"Nierówna podstawa; Jung i mitoznawstwo [B/N].","works":["A-03"],"exercises":["cw-07"],"next":"Zastosuj dwie teorie do jednej sceny i wykaż granice obu","gap":"Jung/Campbell [N], Wróblewska [B], pełny Bettelheim polski [B]"},{"id":7,"title":"Baśnie w strukturze dramatu i powieści","problem":"Rozpoznaj, czy baśń jest szkieletem całej fabuły, osobną opowieścią bohatera, szeregiem motywów, zasadą poznania rzeczywistości czy narzędziem polemiki. Obecność rusałki nie wystarcza, by nazwać cały dramat baśnią.","examples":"M-01 „Ofiara królewny” [T/OCR]: plan pozorowanego porwania i rozłąki, podróż królewicza i Wezyra, pomoc kraski, konkurencyjne systemy Ćwieczka/Gwoździka, epilog „SWOBODA”. Konkurencyjna lektura: satyra i powiastka filozoficzna. M-03 Rak [P: tylko I–III]: „Powiadają”, rusałki, przemoc pańszczyźniana; nie znamy konstrukcji całej powieści. M-02 „Skrzypek Opętany” [B/H]: motywy muzyki, tańca, Alaryela i Rusałki Leśnej z omówień, bez pełnego dramatu i didaskaliów.","questions":"Co by ubyło z M-01 po wyjęciu baśniowego schematu wędrówki? Kiedy muzyka w dramacie jest zdarzeniem, a kiedy komentarzem?","thesis":"Baśń może organizować większy gatunek, a następnie zostać przez niego zakwestionowana.","counter":"„Satyryczna podróż” nie musi być przekształconą baśnią; poszukaj współpracy wzoru próby, daru i zakończenia w całości.","source":"M-01 transkrypcja archiwum X (początek, kraska, Ćwieczek, Gwoździk, Samson, „SWOBODA”) [T/OCR]; M-03 tylko I–III [P]; M-02 edycja Heller Stone 1985 [B/N].","status":"Powieść silniejsza źródłowo, dramat otwarty; brak całości M-02 i M-03 [N].","works":["M-01","M-03","M-02"],"exercises":["cw-04","cw-05"],"next":"Sporządź schemat wędrówki M-01 z kontrinterpretacją","gap":"Pełny dramat i cała powieść Raka [N]; wydanie OCR M-01 [N]"},{"id":8,"title":"Antybaśń jako polemika z klasycznymi modelami baśni","problem":"Nie chodzi o liczenie trupów. Trzeba wykazać oczekiwanie wywołane przez konwencję oraz dokładnie wskazać, którą regułę utwór rozbraja: sprawiedliwość, pomoc, nagrodę, autorytet opowieści, działanie cudu lub rozpoznanie.","examples":"A-03 „Cień”: cień zdobywa prestiż, uczony ginie, oszust poślubia królewnę [T-oryginał]. G-15: utrata dóbr po narastających żądaniach może być właśnie przywróceniem baśniowej sankcji [T-oryginał]. A-05 „Nowe szaty cesarza”: nieistniejąca tkanina demaskuje konformizm, ale satyra pozostaje konkurencyjną interpretacją. N-14 „Lisek Gon”: samo tragiczne nieporozumienie nie dowodzi antybaśni.","questions":"Czy ślub cienia wynagradza cnotę, czy legitymizuje kłamstwo? Czy kara w G-15 polemizuje z klasyczną sprawiedliwością czy ją potwierdza?","thesis":"Antybaśń najsilniej ujawnia się wtedy, kiedy pozytywny znak klasycznej baśni zostaje wykorzystany przeciw jej moralnemu sensowi.","counter":"Taka definicja może nadmiernie rozszerzyć kategorię na każdą satyrę z weselnym finałem; potrzebny jest dowód rozpoznawalnej gry z baśnią.","source":"A-03 i A-05 oryginały duńskie; G-15 niemiecki 1819; N-14 oryginał Aozora.","status":"[T-oryginał]/[I]; „antybaśń” pozostaje kwalifikacją interpretacyjną.","works":["A-03","A-05","G-15","N-14"],"exercises":["cw-01","cw-02","cw-04","cw-08"],"next":"Wskaż dwie naruszone reguły oraz kontrprzykład G-15","gap":"Interpretacje sporne; smutny finał nie jest kryterium"},{"id":9,"title":"Postmodernistyczny retelling znanych baśni","problem":"Retelling jest nową wersją rozpoznawalnej opowieści, która prowadzi dialog z konkretnym pierwowzorem. „Postmodernistyczny” to mocniejsze twierdzenie: pytaj o świadomą grę z kanonem, rolami, władzą, perspektywą narracji, wartościowaniem oraz ewentualną autorefleksję tekstu. Sama modernizacja języka czy zamiana płci nie przesądza wszystkich tych cech.","examples":"P-07 „Królewicz Śnieżek”: dostępny angielski fragment (król szyje przy oknie, krople krwi spadają na śnieg) [P]. Karrie Fransman opisuje zamianę płci przy zachowaniu wydarzeń i zakończeń [B]. Możliwa krytyka norm kulturowych [I]; konkurencyjnie formalna permutacja [H]. O-03 „Smok” [P] bez ustalonego hipoteksu nie jest dowiedzionym retellingiem; M-03 nie można tak klasyfikować na podstawie mitotwórstwa.","questions":"Czy zamiana szyjącej królowej na szyjącego króla zmienia rozkład sprawczości, czy tylko na chwilę uwidacznia stereotyp? Jakiego dowodu wymaga ocena „postmodernistyczności”?","thesis":"Przy niezmienionej akcji przestawienie płci może skłonić czytelnika do krytycznej ponownej lektury kanonu. [I/H]","counter":"Efekt odbioru nie jest równoznaczny z udowodnioną zmianą tekstowej hierarchii wartości; nie przypisuj Kosteckiej analizy Placketta/Fransman.","source":"P-07 angielski fragment Hachette [P]; autorska metoda Karrie Fransman [B]; Kostecka 2014 rozdziały 1, 3–6 [T teoria]; O-03 początek [P].","status":"[P/B/I/H/N] brak pełnych kolacji i bezpośredniego angielskiego hipotekstu.","works":["P-07","O-03","M-03"],"exercises":["cw-06"],"next":"Rozpisz: co ustalono, co interpretujemy, co jest N","gap":"Pełny P-07 i polski tekst [N], bezpośredni angielski hipoteks [N]"}],"exercises":[{"id":"cw-01","title":"Ćwiczenie 1","minutes":15,"prompt":"G-15 oraz A-03: w 120–180 słowach wyjaśnij, dlaczego utrata dóbr i triumf oszusta to różne sposoby działania finału. Przywołaj po jednym zdarzeniu, tezę i kontrargument.","works":["G-15","A-03"],"topics":[1,8]},{"id":"cw-02","title":"Ćwiczenie 2","minutes":20,"prompt":"A-05: obroń i zakwestionuj rozpoznanie „antybaśń”. Odróżnij nieistniejącą magiczną tkaninę od autentycznego cudu; napisz po dwa argumenty dla antybaśni i satyry.","works":["A-05"],"topics":[3,8]},{"id":"cw-03","title":"Ćwiczenie 3","minutes":20,"prompt":"LK-03 lub LK-04: wybierz dar albo próbę. Napisz, czy przemienia sprawczość osoby, która go otrzymuje. Zaznacz, kiedy mówi narrator, a kiedy bohater.","works":["LK-03","LK-04"],"topics":[4]},{"id":"cw-04","title":"Ćwiczenie 4","minutes":25,"prompt":"M-01: porównaj początek (wyobrażenie królewny o idealnym ukochanym), odrzucenie wdzięczności kraski i epilog. Wykaż albo odrzuć tezę o antybaśniowej architekturze całej powieści; nie traktuj Wezyra jako głosu autora.","works":["M-01"],"topics":[1,3,4,7,8]},{"id":"cw-05","title":"Ćwiczenie 5","minutes":15,"prompt":"M-03 tylko I–III: zanotuj trzy formy „Powiadają” i określ: obserwacja / plotka / tradycja / stanowisko narratora. Wyraźnie zaznacz, czego na tej podstawie NIE wolno twierdzić o finale powieści.","works":["M-03"],"topics":[2,3,7]},{"id":"cw-06","title":"Ćwiczenie 6","minutes":20,"prompt":"P-07: napisz argument i kontrargument: „Zamiana płci przy zachowaniu fabuły może być postmodernistycznym retellingiem”. Oddziel ujawnioną metodę autorów od niepoznanej całości tekstu.","works":["P-07"],"topics":[9]},{"id":"cw-07","title":"Ćwiczenie 7","minutes":30,"prompt":"Na jeden i ten sam fragment „Cienia” zastosuj dwie metody: Proppa i Kosteckiej albo Lüthiego i Bettelheima. Zakończ zdaniem o granicach obu modeli.","works":["A-03"],"topics":[1,2,5,6]},{"id":"cw-08","title":"Ćwiczenie 8","minutes":45,"prompt":"Minirozprawka: „Czy baśń jest obietnicą sprawiedliwego porządku, czy narzędziem ujawniania jego iluzji?”. Użyj dwóch tekstów, odwołaj się do kontrargumentu i wskaż statusy źródeł. To ćwiczenie, nie wybór czterech utworów.","works":["G-15","A-03","A-05"],"topics":[1,3,8]}],"diagnostic":{"id":"diag-01","title":"Rozprawka diagnostyczna","minutes":90,"wordTarget":"450–650","prompt":"Temat: „Baśń może jednocześnie obiecywać sprawiedliwy porządek i odsłaniać mechanizmy jego naruszania”. Rozważ trafność tej tezy, analizując DWA albo TRZY konkretne utwory z poznanego korpusu. Zbadaj funkcję co najmniej jednego finału oraz relację między konwencją baśniową a wartościowaniem. Odwołaj się krytycznie do JEDNEJ z poznanych teorii baśni. Uwzględnij poważny kontrargument i wyraźnie odróżnij głos narratora od głosu bohatera.","method":"Czas roboczy: 90 minut. Sugerowana objętość: 450–650 słów — parametry WEWNĘTRZNEGO testu dydaktycznego, nie oficjalne normy Komitetu. Możesz korzystać z własnych podkreśleń i dostępnych tekstów; zapisz edycje i fragmenty, do których się odwołujesz.","after":"Po napisaniu: podkreśl własną tezę; zaznacz dla każdego dowodu: fakt tekstowy / interpretacja / kontrargument; wskaż jedno miejsce wymagające ponownej lektury."},"library":[{"id":"G-15","author":"Jakub i Wilhelm Grimm","title":"O rybaku i jego żonie","period":"redakcja 1819","topics":[1,2,5,8],"scenes":"Rozmowy z rybą, eskalacja żądań, finał i utrata dóbr.","source":"KHM 19, „Von dem Fischer un siine Fru”, 1819, s. 97–104 redakcji źródłowej.","url":"https://de.wikisource.org/wiki/Von_dem_Fischer_un_siine_Fru_(1819)","status":"[T-oryginał]","unknown":"Pełna kolacja z polskim wydaniem 2021 [N]; strony z oryginału nie są stronami Twojego wydania."},{"id":"G-02","author":"Jakub i Wilhelm Grimm","title":"Królewna Śnieżka","period":"redakcja 1819","topics":[2],"scenes":"Historyczna redakcja baśni — materiał do porównań tradycji.","source":"KHM 53, „Sneewittchen”, t. I, s. 262–274 redakcji 1819.","url":"https://de.wikisource.org/wiki/Sneewittchen_(1819)","status":"[T-oryginał]","unknown":"Polska kolacja 2021 [N]."},{"id":"A-03","author":"Hans Christian Andersen","title":"Cień","period":"XIX wiek","topics":[2,3,5,6,8],"scenes":"Dom Poezji; zamiana ról uczony/cień; ślub cienia i los uczonego.","source":"Oryginał duński, cały utwór „Skyggen”.","url":"https://hcandersen.dk/vaerker/skyggen/","status":"[T-oryginał]","unknown":"Polskie lokalizatory i porównanie przekładu [N]."},{"id":"A-05","author":"Hans Christian Andersen","title":"Nowe szaty cesarza","period":"XIX wiek","topics":[3,8],"scenes":"Nieistniejąca „tkanina”, mechanizm oszustwa, dziecko i finał procesji.","source":"Oryginał duński, cały utwór.","url":"https://hcandersen.dk/vaerker/keiserens-nye-klaeder/","status":"[T-oryginał]","unknown":"Polskie lokalizatory [N]."},{"id":"LK-02","author":"Bolesław Leśmian","title":"Jan Tajemnik","period":"modernizm / proza autorska","topics":[1,8],"scenes":"Czerwone buty jako dar wymykający się spod kontroli.","source":"Wolne Lektury; edycja oparta na PAX 1978.","url":"https://wolnelektury.pl/katalog/lektura/klechdy-polskie/","status":"[P/T]","unknown":"Brak pełnej kolacji z rekomendowanym drukiem 1959."},{"id":"LK-03","author":"Bolesław Leśmian","title":"Majka","period":"modernizm / proza autorska","topics":[2,3,4],"scenes":"Zielona księga: ustępy 15–46; finał: 479–508; spojrzenie Marcina.","source":"Wolne Lektury; edycja oparta na PAX 1978.","url":"https://wolnelektury.pl/katalog/lektura/klechdy-polskie/","status":"[P/T]","unknown":"Nie utożsamiać z edycją 1959 bez porównania."},{"id":"LK-04","author":"Bolesław Leśmian","title":"Podlasiak","period":"modernizm / proza autorska","topics":[4],"scenes":"Potwierdzone lokalizatory: ustępy 263–274 i 459–491.","source":"Wolne Lektury; edycja oparta na PAX 1978.","url":"https://wolnelektury.pl/katalog/lektura/klechdy-polskie/","status":"[P/T]","unknown":"Zakres całości i kolacja z wydaniem 1959 bez potwierdzenia w MVP."},{"id":"N-14","author":"Nankichi Niimi","title":"Lisek Gon","period":"XX-wieczna opowieść japońska","topics":[4,8],"scenes":"Anonimowe próby naprawienia winy; rozpoznanie intencji po zabiciu lisa.","source":"Oryginał japoński Aozora, wg karty archiwalnej.","url":"https://www.aozora.gr.jp/cards/000121/card628.html","status":"[T-oryginał wg karty]","unknown":"Polski przekład Joanny Zakrzewskiej 2020 [N]."},{"id":"N-11","author":"Nankichi Niimi","title":"Zakup rękawiczek","period":"XX-wieczna opowieść japońska","topics":[4],"scenes":"Archiwum badawcze odnotowuje osobną kartę N-11, ale w aplikacji nie potwierdzono konkretnych scen z polskiego przekładu.","source":"Archiwum projektu X; audyt XII (karta N-11, oryginał japoński według dokumentacji).","url":"","status":"[T-oryginał wg kart]","unknown":"Nie zweryfikowano brzmienia tytułu w polskiej edycji, tekstu przekładu Joanny Zakrzewskiej 2020 ani lokalizatora [N]."},{"id":"M-01","author":"Jan Lemański","title":"Ofiara królewny","period":"powieść fantastyczna / satyra","topics":[1,4,7,8],"scenes":"Początkowy dialog, dziennik królewny, kraska, Ćwieczek i Gwoździk, Samson, epilog „SWOBODA”.","source":"Archiwum X: M-01_Ofiara_krolewny_PDF-X_transkrypcja_NIEUSTALONE_WYDANIE.txt.","url":"","status":"[T/OCR]","unknown":"Nieustalone wydanie; brak kolacji z Kraków 1985; nie podawać stron wyd. 1985."},{"id":"M-02","author":"Bolesław Leśmian","title":"Skrzypek Opętany","period":"dramat / modernizm","topics":[7],"scenes":"W omówieniach: muzyka, taniec, Alaryel, Rusałka Leśna. Konstrukcji scen i finału nie ustalono.","source":"Wskazana edycja: R. Heller Stone, 1985 — w MVP [B/N].","url":"","status":"[B/H/N]","unknown":"Brak pełnego dramatu i didaskaliów [N]."},{"id":"M-03","author":"Radek Rak","title":"Baśń o wężowym sercu albo Wtóre słowo o Jakóbie Szeli","period":"współczesna powieść (2019)","topics":[2,3,5,7,9],"scenes":"Tylko rozdziały I–III; „Powiadają”, rusałki i przemoc pańszczyźniana.","source":"Opublikowany fragment WP, rozdziały I–III.","url":"https://kultura.wp.pl/nike-2020-przeczytaj-fragment-nagrodzonej-ksiazki-radka-raka-6561133969644416a","status":"[P]","unknown":"Nieznana konstrukcja i finał całej powieści; retelling konkretnej baśni nieudowodniony."},{"id":"O-03","author":"Zuzanna Orlińska","title":"Smok","period":"współczesna proza","topics":[3,9],"scenes":"W dostępnym początku wspólnota nazywa lęk.","source":"Podgląd wydawniczy Virtualo — tylko początek.","url":"https://virtualo.pl/ebook/wspolczesny-bajarz-polski-i355788/","status":"[P]","unknown":"Nie znamy zakończenia i hipoteksu; retelling niepotwierdzony."},{"id":"P-07","author":"Jonathan Plackett / Karrie Fransman","title":"Królewicz Śnieżek","period":"współczesny eksperyment przepisania ról","topics":[9],"scenes":"Angielski fragment: król szyje przy oknie, krople krwi padają na śnieg.","source":"Angielski fragment Hachette; opis metody autorów na stronie Fransman.","url":"https://hachetteindia.com/Home/bookdetails/Info/9780571360185/gender-swapped-fairy-tales","extraUrl":"https://karriefransman.com/project/gender-swapped-fairy-tales/","status":"[P/B]","unknown":"Polski tekst, całość P-07 i bezpośredni angielski hipoteks nieustalone [N]."}],"glossary":[{"term":"Baśń","definition":"Narracja, w której niezwykłe zdarzenia mieszczą się w ustanowionym porządku świata i mają określone funkcje fabularne oraz wartościujące; pojęcie o wielu historycznych odmianach, nie jedno sztywne równanie."},{"term":"Bajka","definition":"Termin wieloznaczny: bywa ogólną nazwą opowieści, lecz w genologii także zwięzłym utworem dydaktycznym, często alegorycznym (np. tradycja ezopowa). W pracach Abramowskiej nie utożsamiać z baśnią magiczną."},{"term":"Baśń literacka","definition":"Autorska, zapisana realizacja lub reinterpretacja tradycji baśniowej, która może ją przekształcać."},{"term":"Baśniowość","definition":"Zespół rozpoznawalnych środków i reguł baśni używany także w innych gatunkach."},{"term":"Cudowność","definition":"Sposób obecności zdarzeń niemożliwych w doświadczeniu potocznym; analizuj, czy narrator je potwierdza, podważa lub tylko przekazuje cudze wierzenie."},{"term":"Antybaśń","definition":"Roboczo: demonstracyjna, znacząca polemika z określoną regułą modelu baśniowego; nie jest synonimem smutnej baśni."},{"term":"Parafraza","definition":"Przekształcenie cudzego tekstu przy zachowaniu rozpoznawalnej podstawy, możliwe również jako ćwiczenie stylistyczne bez zmiany jego sensu."},{"term":"Retelling","definition":"Nowe opowiedzenie rozpoznawalnej wcześniejszej historii; sprawdź identyfikowalny hipoteks, sposób transformacji i jej interpretacyjne skutki."},{"term":"Intertekstualność","definition":"Relacje między tekstami, w tym cytat, aluzja, przepisanie fabuły i polemika."},{"term":"Hipotekst","definition":"Wcześniejszy tekst będący podstawą transformacji; nie domyślaj go z tytułu."},{"term":"Autotematyzm","definition":"Tekstowe komentowanie własnego opowiadania, konstruowania fikcji albo reguł gatunku; nie występuje automatycznie w każdym retellingu."},{"term":"Archetyp","definition":"W teorii Jungowskiej hipotetyczny, powtarzalny wzorzec psychiczno-symboliczny, nie to samo co pojedynczy motyw."},{"term":"Motyw","definition":"Element powracający w fabułach; nie jest równoznaczny z archetypem."},{"term":"Symbol","definition":"Znak o znaczeniach wykraczających poza dosłowność."},{"term":"Funkcja narracyjna","definition":"W ujęciu Proppa działanie postaci zdefiniowane przez rolę w przebiegu akcji (nie rekwizyt, nie cecha charakteru)."},{"term":"Aksjologia","definition":"Układ wartości: co tekst pochwala, potępia, problematyzuje i komu przypisuje prawo do nagrody."},{"term":"Sprawczość","definition":"Zdolność postaci do wpływania na bieg zdarzeń."},{"term":"Narrator niewiarygodny","definition":"Taki, którego rozpoznania czy opowieść dają czytelnikowi powody do korekty; nie utożsamiaj pogłoski bohatera z głosem narratora."},{"term":"Groteska","definition":"Łączenie porządków i deformacja prowadząca do ambiwalencji lub krytycznego komizmu."},{"term":"Satyra","definition":"Krytyczne ośmieszenie zjawisk i postaw; nie musi być antybaśnią."}],"theories":[{"name":"Władimir Propp","status":"[P] polski skrót 1968/4","question":"Jakie funkcje pełnią działania postaci w przebiegu fabuły?","application":"A-03 „Cień”: czy kariera oszusta wypełnia pozycję awansu? G-15: pomoc i eskalacja żądań.","strength":"Porządkuje sekwencje czynności, rozróżnia funkcję od rekwizytu.","limit":"Rosyjska bajka magiczna; nie jest teorią wszystkich baśni, symboliki i moralności."},{"name":"Max Lüthi","status":"[T] artykuł 1973/1","question":"Jak styl narracji odróżnia baśń od podania mimo podobieństwa motywów?","application":"A-03 „Cień”: opowiadanie o cudowności wobec świata obyczaju.","strength":"Oddziela podobieństwo fabuły od stylu gatunkowego.","limit":"Sama klasyfikacja stylu nie dowodzi antybaśniowości."},{"name":"Bruno Bettelheim","status":"[P] esej 1975; [B] polski tom 1985","question":"Jakie konflikty może rozpoznawać w baśni odbiorca dziecięcy?","application":"A-03 „Cień”: czy niepocieszający finał mieści się w normie ujęcia?","strength":"Otwiera interpretację konfliktów i identyfikacji.","limit":"Normatywna funkcja pocieszenia nie dowodzi empirycznego wpływu na czytelnika."},{"name":"Weronika Kostecka","status":"[T] opracowanie 2014","question":"Jak tekst dialoguje z kanonem, regułami, aksjologią i intertekstualnością?","application":"P-07 [H]: hipoteza o permutacji płci; A-03 jako historyczna antycypacja strategii, nie postmodernizm.","strength":"Pozwala oddzielić baśń jako gatunek od baśniowości jako konwencji.","limit":"Nie przypisuj Kosteckiej analizy P-07; transformacja nie przesądza przewartościowania."},{"name":"Janina Abramowska","status":"[T] artykuł 1986/1","question":"Jak działają modele i pogranicza bajki staropolskiej?","application":"Zestawienie z baśnią magiczną wyłącznie jako kontrast terminologiczny.","strength":"Pomaga rozgraniczać bajkę, baśń i pogranicza genologiczne.","limit":"Analizuje przede wszystkim tradycję bajki ezopowej, nie baśnie Grimmów."}],"otherTheory":"Jung, Campbell: [B/N] — brak odczytanej podstawy do konkretnych interpretacji archetypicznych. Wróblewska: [B] — nie formułować twierdzeń szczegółowych bez źródła. Model folklorystyczny i mitoznawczy — tylko w zakresie pytań rozpoznanych w dokumentacji.","scenes":[{"title":"Scena A — G-15: finał żądań","fact":"Fakt [T-oryginał]: narastające prośby kończą się utratą uzyskanych dóbr.","interpretation":"Interpretacja [I]: sankcja przywraca granicę pragnienia.","challenge":"Czy rybak jest równie winny jak żona? Nie wnioskuj „antybaśń” z samej utraty."},{"title":"Scena B — A-03: małżeństwo cienia","fact":"Fakt [T-oryginał]: cień osiąga królewskie uznanie, uczony zostaje usunięty.","interpretation":"Interpretacja [I]: znak baśniowego sukcesu legitymizuje kłamstwo.","challenge":"Czy przypowieść o wiedzy i władzy jest równie mocną interpretacją?"},{"title":"Scena C — LK-03: zielona księga","fact":"Fakt [P/T]: księga trafia do niepiśmiennego Marcina.","interpretation":"Interpretacja [I]: cudowny dar nie gwarantuje dostępu do znaczenia.","challenge":"Kto uznał wiedzę za niemożliwą i czy tekst daje inną drogę rozumienia?"},{"title":"Scena D — M-01: kraska i finał","fact":"Fakt [T/OCR]: uratowane zwierzę oferuje pomoc, Wezyr odrzuca; epilog akcentuje „SWOBODĘ”.","interpretation":"Interpretacja [I]: baśniowa pomoc i weselna restytucja zostają przewartościowane.","challenge":"Możliwa parodia ideologii i podróży bez wcześniejszej obietnicy klasycznej baśni."}],"methods":[{"title":"Jak rozpoznać antybaśń","text":"Krok 1: wskaż oczekiwanie znane z określonej formy baśni. Krok 2: znajdź działanie tekstu, które to oczekiwanie podważa. Krok 3: pokaż skutek wartościujący (kto zyskuje, kto traci, czy sprawiedliwość zostaje wypaczona). Krok 4: porównaj interpretację alternatywną — zwykła bajka dydaktyczna, moralitet, satyra, tragedia. Surowość kary czy śmierć nie są samodzielnym kryterium: w baśniach klasycznych istnieją okrucieństwo, kara i tragiczne sytuacje."},{"title":"Retelling czy zwykła przeróbka?","text":"Dowiedź rozpoznawalnego poprzedniego utworu (tekst, wersja, język); skonfrontuj zachowane elementy i świadome przestawienia; ustal, czy rola bohatera, punkt widzenia i wartości rzeczywiście się zmieniają. Przeróbka stylistyczna jest transformacją, lecz słabe może być jej znaczenie interpretacyjne. „Postmodernistyczny” wymaga osobnego argumentu o grze z kanonem i podważaniu lub komentowaniu reguł."},{"title":"Baśń w dramacie i powieści","text":"Zadaj kolejno: kto przywołuje motyw? czy opowieść występuje w tekście jako cytowana historia? czy cud wywołuje zdarzenia na scenie? czy schemat próby i rozwiązania scala całą fabułę? jaka konwencja konkurencyjna (symbolizm, satyra, powieść historyczna) wprowadza napięcie? Dla M-02 i pełnej M-03 zaznacz odpowiedzi „nie ustalono”, dopóki nie przeczytasz całości."}],"source":{"topic":"Baśnie i antybaśnie w literaturze różnych epok","intro":"Baśń jest nie tylko opowieścią o niezwykłych zdarzeniach. To sposób porządkowania doświadczenia: pokazuje, kto może działać, skąd bierze się przeszkoda, jak działa pomoc, co wspólnota uznaje za sprawiedliwe i czy finał potwierdza te reguły. Literatura różnych epok przejmuje ten model, przerabia go albo wystawia na próbę. Odróżniaj baśń jako gatunek od baśniowości jako konwencji obecnej również w dramacie, satyrze i powieści. Analizuj także historyczny wariant tekstu: Grimm 1819 to konkretna redakcja, nie ponadczasowy abstrakt.","how":"Pracuj z tekstem otwartym obok. W każdym zagadnieniu najpierw rozpoznaj, CO jest zapisane w utworze, potem zaproponuj, CO to znaczy, a następnie postaw swojej interpretacji najtrudniejszy zarzut. Własna teza nie jest streszczeniem. Przykłady służą treningowi, a nie wyborowi finałowej czwórki. [N] jest pytaniem otwartym, nie gotową odpowiedzią. Oryginały i przekłady nie są traktowane jako identyczne.","status":"[T] pełny tekst wskazanej edycji; [T-oryginał] pełny oryginał obcojęzyczny, nie polski przekład; [P] fragment; [B] omówienie/bibliografia; [I] propozycja interpretacji; [H] hipoteza; [N] brak potwierdzenia. [T/OCR] M-01 — transkrypcja pełna bez ustalonego wydania. Statusy opisują stan badań, a nie Twoje umiejętności.","contract":"Zamrożony katalog 90 ID: G-01–15, A-01–20, LK-01–05, O-01–20, N-01–15, P-01–12, M-01–03; 36/90 pełnych kart, osobno 7 duńskich dossier. 15 Grimmów, 20 Andersenów. Trzy kupione książki: dwa tomy Andersena przeł. Bogusława Sochańska i Grimm przeł. Eliza Pieciul-Karmińska (Media Rodzina 2021). Nie ma wymogu trzech tomów Andersena 2006. Maksymalnie jedna lektura obowiązkowa spośród finalnych 3–4 pozycji (status weryfikować). Bez rankingu i finalistów na tym etapie. Po pełnym rekonesansie 90 → 10–12 → 6–8 → dokładnie 4; późniejsza metodologia: 40% średnia jakość utworów + 60% jakość zestawu. To nie jest wskaźnik Twoich wyników.","sourceDocs":{"main":"https://docs.google.com/document/d/1Vj_8h6gPmMn8dIDqomM35vK5lK5J5uuYFusVyLe3nuM/edit"}}};

const download=(obj,name)=>{let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json;charset=utf-8'});let u=URL.createObjectURL(blob);let a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)};
const readJSON=(file)=>new Promise((resolve,reject)=>{if(!file||file.size>10_000_000){reject(Error('Niepoprawny plik lub przekroczono 10 MB.'));return}let f=new FileReader();f.onload=()=>{try{resolve(JSON.parse(f.result))}catch(e){reject(Error('To nie jest poprawny plik JSON.'))}};f.onerror=()=>reject(Error('Nie udało się odczytać pliku.'));f.readAsText(file,'utf-8')});
let storageOK=true;
const storage={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){storageOK=false;return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){storageOK=false;return false}}};
function toast(msg){let t=$('#toast');if(!t)return;t.textContent=msg;t.classList.remove('hidden');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>t.classList.add('hidden'),4300)}
function escapeDownloadName(x){return x.replace(/[^a-z0-9_-]+/gi,'-')}
function navCard(id,label,meta,desc){return `<button class="listcard" data-go="${h(id)}"><span class="overline">${h(meta)}</span><strong>${h(label)}</strong><span class="small">${h(desc||'')}</span></button>`}
function boxStatus(s){return `<span class="tag ${s?.includes('[N]')||s?.includes('[H]')?'warn':''}">${h(s||'[N]')}</span>`}
function sourcesFor(ids){let w=DATA.library.filter(x=>ids.includes(x.id));return w.map(x=>`<div class="details"><strong>${h(x.title)}</strong> <span class="small">(${h(x.id)})</span> <span class="source-flag">${h(x.status)}</span><p class="small">${h(x.source)} ${x.url?`<a href="${h(x.url)}" target="_blank" rel="noopener noreferrer">Otwórz źródło ↗</a>`:''}</p><p class="small"><strong>Czego nie potwierdzono:</strong> ${uxRead(x.unknown)}</p></div>`).join('')||'<p class="small">Brak lokalizatorów w bieżącym MVP.</p>'}
function uxWorkName(id){const w=DATA.library.find(x=>x.id===id);return w?(w.author+' — „'+w.title+'”'):(UX.idGroups.find(g=>id.startsWith(g[0]+'-'))?.[1]||'utwór z katalogu');}
function uxFlags(){return `<details class="details legend-details"><summary>Co znaczą oznaczenia źródeł? Rozwiń legendę</summary><div class="legend-grid">${UX.sourceFlags.map(([flag,desc])=>`<div><strong>${h(flag)}</strong><span>${h(desc)}</span></div>`).join('')}</div><p class="small">Kody utworów to skróty katalogowe, np. A-03 oznacza „Cień” Andersena, a G-15 „O rybaku i jego żonie” Grimmów. Litery wskazują grupę autora lub tekstów.</p><p class="small">Oznaczenia opisują zakres sprawdzenia źródeł, a nie Twoje wyniki.</p></details>`;}
function uxRef(id){return `<span class="work-code"><span class="code-label">${h(id)}</span><span> ${h(uxWorkName(id))}</span></span>`;}
function uxRead(text){const escaped=h(text);return escaped.replace(/\b(?:G|A|LK|O|N|P|M)-\d{2}\b/g,id=>`<abbr class="work-abbr" title="${h(uxWorkName(id))}">${h(id)}</abbr>`);}
function uxGlossaryCard(term){const g=DATA.glossary.find(x=>x.term===term);return g?`<details class="details definition"><summary><strong>${h(term)}</strong> — ${h(UX.glossary[term]||g.definition)}</summary><p class="small">Dokładniej: ${h(g.definition)}</p></details>`:'';}
function uxContext(t){return `<section class="inline-context" aria-label="Objaśnienia do zagadnienia"><h3>Przydatne pojęcia</h3>${UX.topics[t.id-1].terms.map(uxGlossaryCard).join('')}</section>`;}
function uxTaskTitle(e){return e.id==='cw-08'?'Ćwiczenie 8 — minirozprawka podsumowująca':e.title;}
function uxSteps(raw){const parts=String(raw).split(/\s*;\s*|\s*\.\s+(?=[A-ZŁŚĆŹŻĄĘÓŃ])/).map(x=>x.trim()).filter(Boolean);return `<ul class="brief-list">${parts.map(part=>`<li>${uxRead(part)}</li>`).join('')}</ul>`;}
function makeSidebar(isTeacher){let items=isTeacher?[['start','Przegląd'],['coverage','Mapa zagadnień'],['arguments','Argumenty'],['warnings','Ostrzeżenia i luki'],['works','Prace ucznia'],['history','Historia ocen'],['data','Import i eksport']]:[['start','Dzisiaj'],['topics','Zagadnienia'],['works','Moje prace'],['progress','Postępy'],['library','Biblioteka']];$('#sidebar').innerHTML=`<div class="brand"><div class="monogram">OLiJP / 2026</div><div class="brandtitle">Zeszyt olimpijski</div><div class="brandsub">Baśnie i antybaśnie</div></div><nav class="nav" aria-label="Nawigacja główna">${items.map(([id,label],i)=>`<button type="button" data-go="${id}" class="${i===0?'active':''}"><span class="num">${('0'+(i+1)).slice(-2)}</span>${label}</button>`).join('')}</nav><div class="sidebar-bottom"><div>Oryginały ≠ polskie przekłady.</div><div>Stan badań ≠ Twoje umiejętności.</div><div style="margin-top:13px"><button class="btn sm" data-theme>◐ Zmień motyw</button></div></div>`;}
function setNav(page){$$('.nav button').forEach(e=>e.classList.toggle('active',e.dataset.go===page));$('#crumb').textContent=({start:'Dzisiaj',topics:'Zagadnienia',library:'Biblioteka',glossary:'Słownik i teorie',workshop:'Warsztat',diagnostic:'Diagnoza',progress:'Postępy',coverage:'Mapa zagadnień',arguments:'Bank argumentów',warnings:'Ostrzeżenia',works:'Moje prace',history:'Historia ocen',data:'Dane'})[page]||page;}

try{if(localStorage.getItem('olijp-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}
